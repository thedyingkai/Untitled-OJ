schema_version: 1
policy:
  compatibility_start: "schema_version: 1"
  unknown_top_level_fields: reject
  unknown_provides_fields: reject
  dangerous_unknown_fields: reject
  field_removal_or_rename: "requires schema_version: 2"

required:
  - schema_version
  - id
  - name
  - version
  - set
  - kind
  - status

fields:
  schema_version:
    type: integer
    allowed: [1]
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9.-]*$"
  name:
    type: string
  version:
    type: semver
  set:
    type: string
  kind:
    type: string
    allowed: [kernel, platform, feature, integration, metadata]
  status:
    type: string
    allowed: [builtin, external, demo]
  description:
    type: string
    max_length: 2000
  compatibility:
    platform: version_constraint
    installer: version_constraint
  requires:
    modules:
      - id: module_id
        version: version_constraint
  provides:
    permissions:
      - key: permission_key
        description: string
    roles:
      - key: role_key
        description: string
    components:
      - id: component_id
        type: string
        status: string
        config: object
    services:
      - id: service_id
        name: string
        kind: string
        lifecycle: [managed, metadata, external, manual]
        trusted_runtime: [compose, metadata, external]
        compose_service: string
        health_check_id: string
        routes: [path]
        required: boolean
        path: relative_path
        health: path
        exposure: string
    workers:
      - id: service_id
        name: string
        kind: string
        lifecycle: [managed, metadata, external, manual]
        trusted_runtime: [compose, metadata, external]
        compose_service: string
        health_check_id: string
        required: boolean
        path: relative_path
        mode: string
    frontend_routes:
      - path: path
        name: string
        component_key: string
        required_permission: permission_key
        enabled: boolean
    menus:
      - key: menu_key
        title: string
        route_path: path
        icon: string
        parent_key: string
        sort_order: integer
        required_permission: permission_key
        enabled: boolean
    gateway_routes:
      - prefix: path
        service_id: service_id
        auth_mode: [public, user, admin, worker, internal, none, optional, required]
        enabled: boolean
    storage:
      buckets: [storage_bucket_id]
    storage_buckets:
      - id: storage_bucket_id
        description: string
    health_checks:
      - id: health_check_id
        type: string
        optional: boolean
    migrations:
      - up: "deploy/migrations/*.up.sql"
        down: "deploy/migrations/*.down.sql"
    events:
      publishes: [event_name]
      subscribes: [event_name]
    scheduled_jobs:
      - id: job_id
        description: string
        enabled: boolean
    admin_panels:
      - id: panel_id
        route_path: path
        required_permission: permission_key
    topology:
      nodes:
        - id: node_id
          type: string
          label: string
      edges:
        - from: node_id
          to: node_id
          type: string
  package:
    format: ojosmod
    version: 1
    created_by: string
    signature: nullable_string
    signing_key_id: nullable_string
    trusted_publisher: nullable_string

forbidden_anywhere:
  - secret
  - token
  - password
  - private_key
  - env
  - command
  - script
  - hook
  - image
  - mount
  - host_path
  - privileged
  - cap_add
  - postinstall
  - preinstall
  - remote_url
  - download_url
  - target_url
