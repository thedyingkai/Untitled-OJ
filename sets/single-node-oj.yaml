schema_version: 1
id: single-node-oj
name: 单机 OJ
description: 在一个 host 上运行入口、题库、评测 API、Worker、数据库、缓存和存储。
scenario:
  type: single-host
  recommended_for:
    - 本地开发
    - 小型训练
    - 单机演示
services:
  - id: postgresql
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: redis
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: storage-service
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: minio
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: auth-service
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: user-service
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: problem-service
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: judge-api
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: judge-worker
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: gateway
    required: true
    count: 1
    placement: { host: root }
    config: {}
default_endpoints:
  - { service: gateway, port: 8080, protocol: http, expose: true }
  - { service: auth-service, port: 8081, protocol: http, expose: false }
  - { service: user-service, port: 8084, protocol: http, expose: false }
  - { service: problem-service, port: 8083, protocol: http, expose: false }
  - { service: judge-api, port: 8082, protocol: http, expose: false }
  - { service: judge-worker, port: 9101, protocol: http, expose: false }
  - { service: postgresql, port: 5432, protocol: postgres, expose: false }
  - { service: redis, port: 6379, protocol: redis, expose: false }
  - { service: storage-service, port: 8085, protocol: http, expose: false }
  - { service: minio, port: 9000, protocol: http, expose: false }
default_links:
  - { from: gateway, to: auth-service, protocol: http, auth_mode: internal, scope: api, required: true }
  - { from: gateway, to: user-service, protocol: http, auth_mode: internal, scope: api, required: true }
  - { from: gateway, to: problem-service, protocol: http, auth_mode: internal, scope: api, required: true }
  - { from: gateway, to: judge-api, protocol: http, auth_mode: internal, scope: api, required: true }
  - { from: auth-service, to: postgresql, protocol: postgres, auth_mode: secret-ref, scope: database, required: true }
  - { from: auth-service, to: redis, protocol: redis, auth_mode: internal, scope: cache, required: true }
  - { from: user-service, to: auth-service, protocol: http, auth_mode: internal, scope: auth, required: true }
  - { from: user-service, to: postgresql, protocol: postgres, auth_mode: secret-ref, scope: database, required: true }
  - { from: user-service, to: storage-service, protocol: http, auth_mode: internal, scope: object-storage, required: true }
  - { from: storage-service, to: minio, protocol: http, auth_mode: secret-ref, scope: object-storage-backend, required: true }
  - { from: problem-service, to: postgresql, protocol: postgres, auth_mode: secret-ref, scope: database, required: true }
  - { from: problem-service, to: storage-service, protocol: http, auth_mode: internal, scope: object-storage, required: true }
  - { from: judge-api, to: problem-service, protocol: http, auth_mode: internal, scope: problem-catalog, required: true }
  - { from: judge-api, to: postgresql, protocol: postgres, auth_mode: secret-ref, scope: database, required: true }
  - { from: judge-api, to: redis, protocol: redis, auth_mode: internal, scope: queue, required: true }
  - { from: judge-api, to: storage-service, protocol: http, auth_mode: internal, scope: object-storage, required: true }
  - { from: judge-worker, to: judge-api, protocol: http, auth_mode: secret-ref, scope: worker, required: true }
  - { from: judge-worker, to: redis, protocol: redis, auth_mode: internal, scope: queue, required: true }
  - { from: judge-worker, to: storage-service, protocol: http, auth_mode: internal, scope: object-storage, required: true }
policies:
  placement: { single_host: true }
  security: { secret_ref_only: true }
  network: { link_required: true }
  health: { require_all_required_services: true }
operations:
  install_order: [postgresql, redis, minio, storage-service, auth-service, user-service, problem-service, judge-api, judge-worker, gateway]
  start_order: [postgresql, redis, minio, storage-service, auth-service, user-service, problem-service, judge-api, judge-worker, gateway]
  stop_order: [gateway, judge-worker, judge-api, problem-service, user-service, auth-service, storage-service, minio, redis, postgresql]
notes: Set 只描述推荐部署组合，不包含 OJ 业务逻辑。
