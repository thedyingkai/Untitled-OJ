schema_version: 1
id: service-development
name: Service 开发
description: 面向 Service 作者的最小开发组合，用于校验 service.yaml、Endpoint、Link 和基础依赖。
scenario:
  type: development
  recommended_for:
    - Service 开发
    - 契约校验
    - 本地联调
services:
  - id: postgresql
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: redis
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: storage-service
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: minio
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: auth-service
    required: true
    count: 1
    placement: { host: root }
    config: {}
  - id: gateway
    required: true
    count: 1
    placement: { host: root }
    config:
      rate_limit_per_minute: 1200
default_endpoints:
  - { service: gateway, port: 8080, protocol: http, expose: true }
  - { service: auth-service, port: 8081, protocol: http, expose: false }
  - { service: postgresql, port: 5432, protocol: postgres, expose: false }
  - { service: redis, port: 6379, protocol: redis, expose: false }
  - { service: storage-service, port: 8085, protocol: http, expose: false }
  - { service: minio, port: 9000, protocol: http, expose: false }
default_links:
  - { from: gateway, to: auth-service, protocol: http, auth_mode: internal, scope: api, required: true }
  - { from: auth-service, to: postgresql, protocol: postgres, auth_mode: secret-ref, scope: database, required: true }
  - { from: auth-service, to: redis, protocol: redis, auth_mode: internal, scope: cache, required: true }
  - { from: storage-service, to: minio, protocol: http, auth_mode: secret-ref, scope: object-storage-backend, required: true }
policies:
  placement: { local_development: true }
  security: { secret_ref_only: true }
  network:
    link_required: true
    required_external_links:
      - gateway -> user-service
      - gateway -> problem-service
      - gateway -> judge-api
  health: { allow_optional_service_absence: true }
operations:
  install_order: [postgresql, redis, minio, storage-service, auth-service, gateway]
  start_order: [postgresql, redis, minio, storage-service, auth-service, gateway]
  stop_order: [gateway, auth-service, storage-service, minio, redis, postgresql]
notes: 开发中的 Service 通过 Orchestrator 导入和校验，构建产物不是核心对象。
