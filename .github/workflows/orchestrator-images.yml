name: Orchestrator product images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ojos-orchestrator-control-plane
            dockerfile: services/orchestrator/backend/Dockerfile
          - image: ojos-orchestrator-agent
            dockerfile: services/orchestrator/agent/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            OJOS_BUILD_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
