name: Kernel CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Test Go modules
        shell: bash
        run: |
          set -euo pipefail
          for dir in services/shared services/auth services/gateway services/problem-api services/judge-api; do
            (cd "$dir" && go test ./...)
          done

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test installer workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo check
          cargo test
      - name: Test judge worker
        shell: bash
        run: |
          set -euo pipefail
          cd services/judge-worker
          cargo fmt --check
          cargo check
          cargo test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  service-runtime-acceptance:
    name: Service runtime acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run service-first checks
        run: |
          cargo test -p service-installer-core checked_in_service_manifests_validate
          cargo test -p service-installer-core checked_in_gateway_package_verifies
          cargo test -p service-installer-core service_install_plan_uses_service_actions
          cargo test -p service-installer-core set_validate_and_expand
          cargo run -p ojosctl -- service validate services/gateway/service.yaml
          cargo run -p ojosctl -- service package services/gateway -o .tmp/release/gateway.ojossvc
          cargo run -p ojosctl -- service verify .tmp/release/gateway.ojossvc
          cargo run -p ojosctl -- set expand sets/single-node-oj.yaml
          cargo run -p ojosctl -- endpoint validate 127.0.0.1:8080
          cargo run -p ojosctl -- link plan-create 127.0.0.1:8080 127.0.0.1:8083
          cargo run -p ojosctl -- topology snapshot
