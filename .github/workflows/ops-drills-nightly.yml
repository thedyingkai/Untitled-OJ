name: Ops Drills Nightly

on:
  schedule:
    - cron: "11 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-functional-observability:
    name: Recovery, functional and observability drills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            platform/shared/go/go.sum
            services/auth-service/go.sum
            services/gateway/go.sum
            services/storage-service/go.sum
            services/problem-service/go.sum
            services/judge-api/go.sum
            services/user-service/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11"
          cache: npm
          cache-dependency-path: manager/web/package-lock.json
      - name: Service credential lifecycle drill
        shell: bash
        env:
          OJOS_EVIDENCE_DIR: artifacts/service-credential-drill
        run: bash deploy/ops/service-credential-drill.sh
      - name: Redis recovery drill
        shell: bash
        env:
          OJOS_EVIDENCE_DIR: artifacts/redis-recovery-drill
        run: bash deploy/ops/redis-recovery-drill.sh
      - name: Alert firing drill
        shell: bash
        env:
          OJOS_EVIDENCE_DIR: artifacts/alert-firing-drill
        run: bash deploy/ops/alert-firing-drill.sh
      - name: Orchestrator Web v1 control workflows
        shell: bash
        working-directory: manager/web
        run: |
          set -euo pipefail
          npm ci --registry=https://registry.npmjs.org
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Orchestrator TUI v1 contract
        shell: bash
        run: cargo test -p ojos-orchestrator-tui
      - name: Upload ops drill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ops-drill-evidence
          path: |
            artifacts
            manager/web/playwright-report
