name: Sync Docs To Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/sync-wiki.yml"

permissions:
  contents: write

concurrency:
  group: sync-docs-to-wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs directory to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare wiki mirror
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .wiki-src
          mkdir -p .wiki-src
          cp -R docs/. .wiki-src/

          cp docs/DOCS_INDEX.md .wiki-src/Home.md

          cat > .wiki-src/_Sidebar.md <<'EOF'
          # OJOS Wiki

          - [首页](Home)
          - [文档索引](DOCS_INDEX)
          - [文档状态](DOCS_STATUS)

          ## 架构
          - [Service-first 架构](architecture/service-first-architecture)
          - [Root Runtime Manager](architecture/root-runtime-manager)
          - [Service / Endpoint / Link](architecture/service-endpoint-link-model)
          - [Set 模型](architecture/set-model)
          - [Device 模型](architecture/device-model)
          - [Topology 模型](architecture/topology-model)

          ## Service
          - [service.yaml 契约](services/service-yaml-contract)
          - [基础服务](services/base-services)
          - [Gateway Service](services/gateway-service)
          - [Web Shell Service](services/web-shell-service)
          - [Judge Worker Service](services/judge-worker-service)

          ## Runtime
          - [Endpoint Manager](runtime/endpoint-manager)
          - [Link Manager](runtime/link-manager)
          - [Topology Manager](runtime/topology-manager)
          - [Non-root Agent](runtime/non-root-agent)
          - [Service Registry](runtime/service-registry)

          ## Installer
          - [CLI](installer/cli)
          - [Native GUI](installer/native-gui)
          - [Terminal TUI](installer/terminal-tui)

          ## Release
          - [Service-first Gate](release/service-first-rebase-gate)
          - [Service-first Acceptance](release/service-first-acceptance)
          EOF

      - name: Push mirror to wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          rm -rf .wiki-repo
          if ! git clone "$wiki_url" .wiki-repo; then
            echo "GitHub Wiki 仓库不可访问。请确认仓库已启用 Wiki，并配置可写 token。"
            exit 1
          fi

          find .wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .wiki-src/. .wiki-repo/

          cd .wiki-repo
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki 已经是最新内容，无需推送。"
            exit 0
          fi

          git commit -m "docs: sync repository docs to wiki"
          git push
