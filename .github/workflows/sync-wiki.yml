name: Sync Docs To Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/sync-wiki.yml"

permissions:
  contents: write

concurrency:
  group: sync-docs-to-wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs directory to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare wiki mirror
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .wiki-src
          mkdir -p .wiki-src

          # GitHub wiki (gollum) keys every page by a FLAT slug (its basename),
          # so nested paths like docs/orchestrator/boundary.md are served as the
          # page "orchestrator-boundary" only if we flatten them ourselves.
          # Flatten docs/<dir>/<name>.md -> <Dir>-<Name>.md at the wiki root and
          # generate the sidebar from the same slugs so links never 404.

          # slug_for <docs-relative-path-without-extension> -> Capitalized-Hyphen slug
          slug_for() {
            local rel="$1"
            local IFS='/'
            local out="" part
            for part in $rel; do
              # capitalize first letter of each path segment, keep the rest
              local head="${part:0:1}"
              local tail="${part:1}"
              head="$(printf '%s' "$head" | tr '[:lower:]' '[:upper:]')"
              if [ -n "$out" ]; then
                out="${out}-${head}${tail}"
              else
                out="${head}${tail}"
              fi
            done
            printf '%s' "$out"
          }

          # README.md -> Home page. The in-repo docs/README.md index is skipped:
          # the wiki sidebar below IS the index, so a second "README" page would be
          # redundant.
          cp README.md .wiki-src/Home.md

          # Copy every docs/*.md (except the index) to a flat, unique wiki page.
          declare -a pages=()
          while IFS= read -r -d '' src; do
            rel="${src#docs/}"          # e.g. orchestrator/boundary.md
            [ "$rel" = "README.md" ] && continue
            rel_noext="${rel%.md}"      # e.g. orchestrator/boundary
            slug="$(slug_for "$rel_noext")"
            cp "$src" ".wiki-src/${slug}.md"
            pages+=("${rel_noext}=${slug}")
          done < <(find docs -type f -name '*.md' -print0 | sort -z)

          # Generate the sidebar from the actual page slugs so it can never drift.
          # Links use the exact flat slug produced above, so they never 404.
          # The human title is each doc's first "# " heading (Chinese), which
          # keeps the sidebar readable and in sync with the page content.
          {
            echo "# OJOS Wiki"
            echo
            echo "- [首页](Home)"
            for entry in "${pages[@]}"; do
              rel_noext="${entry%%=*}"
              slug="${entry#*=}"
              title="$(sed -n 's/^# //p' ".wiki-src/${slug}.md" | head -n 1)"
              if [ -z "$title" ]; then
                # fall back to the last path segment if a doc has no H1
                title="${rel_noext##*/}"
                title="${title//-/ }"
                title="${title//_/ }"
              fi
              echo "- [${title}](${slug})"
            done
          } > .wiki-src/_Sidebar.md

      - name: Push mirror to wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          rm -rf .wiki-repo
          if ! git clone "$wiki_url" .wiki-repo; then
            echo "GitHub Wiki is not reachable. Enable Wiki for the repository or configure a writable WIKI_PUSH_TOKEN."
            exit 1
          fi

          find .wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .wiki-src/. .wiki-repo/

          cd .wiki-repo
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync repository docs to wiki"
          git push
