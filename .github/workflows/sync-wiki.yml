name: Sync Docs To Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - ".github/scripts/**"
      - ".github/workflows/sync-wiki.yml"

permissions:
  contents: write

concurrency:
  group: sync-docs-to-wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs directory to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare wiki mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/build_wiki.py \
            --root . \
            --output .wiki-src \
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${GITHUB_REF_NAME}"

      - name: Push mirror to wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          rm -rf .wiki-repo
          if ! git clone "$wiki_url" .wiki-repo; then
            echo "GitHub Wiki is not reachable. Enable Wiki for the repository or configure a writable WIKI_PUSH_TOKEN."
            exit 1
          fi

          find .wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .wiki-src/. .wiki-repo/

          cd .wiki-repo
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync repository docs to wiki"
          git push
