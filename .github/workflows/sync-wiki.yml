name: Sync Docs To Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/sync-wiki.yml"

permissions:
  contents: write

concurrency:
  group: sync-docs-to-wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs directory to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare wiki mirror
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .wiki-src
          mkdir -p .wiki-src
          cp -R docs/. .wiki-src/

          cp README.md .wiki-src/Home.md

          cat > .wiki-src/_Sidebar.md <<'EOF'
          # OJOS Wiki

          - [首页](Home)
          - [Service 规范](spec/service-spec)
          - [Set 规范](spec/set-spec)
          - [Endpoint / Link](spec/endpoint-link-spec)

          ## Orchestrator
          - [需求](orchestrator/requirements)
          - [边界](orchestrator/boundary)
          - [Action Model](orchestrator/action-model)
          - [GUI / TUI 等价性](orchestrator/gui-tui-parity)
          - [Topology](orchestrator/topology-model)
          - [Operation](orchestrator/operation-model)
          - [数据库](orchestrator/database)

          ## 历史区
          旧文档保存在仓库的 docs-temp/，不作为正式 Wiki 来源。
          EOF

      - name: Push mirror to wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          rm -rf .wiki-repo
          if ! git clone "$wiki_url" .wiki-repo; then
            echo "GitHub Wiki 仓库不可访问。请确认仓库已启用 Wiki，并配置可写 token。"
            exit 1
          fi

          find .wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .wiki-src/. .wiki-repo/

          cd .wiki-repo
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki 已经是最新内容，无需推送。"
            exit 0
          fi

          git commit -m "docs: sync repository docs to wiki"
          git push
