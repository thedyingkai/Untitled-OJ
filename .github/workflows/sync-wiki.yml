name: Sync Docs To Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/sync-wiki.yml"

permissions:
  contents: write

concurrency:
  group: sync-docs-to-wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs directory to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare wiki mirror
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .wiki-src
          mkdir -p .wiki-src
          cp -R docs/. .wiki-src/

          # GitHub Wiki 使用 Home.md 作为首页。
          cp docs/index.md .wiki-src/Home.md

          cat > .wiki-src/_Sidebar.md <<'EOF'
          # OJOS Wiki

          - [首页](Home)
          - [文档索引](docs-index)
          - [文档状态](docs-status)

          ## 架构
          - [概览](architecture/overview)
          - [模块拓扑](architecture/module-topology)
          - [服务拓扑](architecture/service-topology)
          - [Worker Link 协议](architecture/worker-link-protocol)

          ## 模块
          - [模块系统](modules/index)
          - [Judge Core](modules/judge-core)

          ## Judge
          - [资源限制](judge/judge-resource-limits)
          - [状态模型](judge/judge-status-model)
          - [Worker 集群](judge/judge-worker-cluster)

          ## 部署
          - [Control Plane 部署](deploy/deploy-control-plane)
          - [Worker Node 部署](deploy/deploy-worker-node)
          - [Docker Compose](deploy/docker-compose)

          ## API
          - [API 索引](api/index)
          - [Admin API](api/admin-api)
          - [Worker API](api/worker-api)

          ## 安全
          - [安全边界](security/security-boundary)
          - [Worker Token](security/worker-token)
          - [Internal HMAC](security/internal-hmac)

          ## E2E
          - [工程验收](e2e/e2e-engineering-acceptance)
          - [Linux Runtime](e2e/e2e-linux-runtime)
          - [静态检查](e2e/e2e-static-checks)
          EOF

      - name: Push mirror to wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          rm -rf .wiki-repo
          if ! git clone "$wiki_url" .wiki-repo; then
            echo "GitHub Wiki 仓库不可访问。请先在仓库 Settings 中启用 Wiki，并创建一次 Wiki 首页。"
            echo "如果 GITHUB_TOKEN 没有 Wiki 写权限，请创建 repo scope 的 WIKI_PUSH_TOKEN secret。"
            exit 1
          fi

          find .wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .wiki-src/. .wiki-repo/

          cd .wiki-repo
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki 已经是最新内容，无需推送。"
            exit 0
          fi

          git commit -m "docs: sync repository docs to wiki"
          git push
