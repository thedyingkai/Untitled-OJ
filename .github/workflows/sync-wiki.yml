name: Sync Docs To Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "deploy/cross-machine/README.md"
      - "deploy/worker/README.md"
      - "sdk/service-sdk/README.md"
      - ".github/scripts/**"
      - ".github/workflows/sync-wiki.yml"

permissions:
  contents: write

concurrency:
  group: sync-docs-to-wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs directory to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare wiki mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/build_wiki.py \
            --root . \
            --output .wiki-src \
            --repository "${GITHUB_REPOSITORY}" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Push mirror to wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          rm -rf .wiki-repo
          if ! git clone "$wiki_url" .wiki-repo; then
            echo "GitHub Wiki is not reachable. Enable Wiki for the repository or configure a writable WIKI_PUSH_TOKEN."
            exit 1
          fi

          find .wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R .wiki-src/. .wiki-repo/

          cd .wiki-repo
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "docs: sync repository docs to wiki"
            git push
          fi

          local_head="$(git rev-parse HEAD)"
          local_tree="$(git rev-parse 'HEAD^{tree}')"
          remote_head="$(git ls-remote "$wiki_url" HEAD | awk 'NR == 1 {print $1}')"
          if [[ -z "$remote_head" || "$remote_head" != "$local_head" ]]; then
            echo "Remote Wiki HEAD does not match the local mirror commit."
            exit 1
          fi

          readback_dir="${RUNNER_TEMP}/ojos-wiki-readback"
          rm -rf "$readback_dir"
          git clone --depth 1 "$wiki_url" "$readback_dir"
          remote_tree="$(git -C "$readback_dir" rev-parse 'HEAD^{tree}')"
          if [[ "$remote_tree" != "$local_tree" ]]; then
            echo "Remote Wiki tree does not match the pushed mirror."
            exit 1
          fi
          if ! cmp --silent \
            "$readback_dir/Source-Identity.md" \
            "${GITHUB_WORKSPACE}/.wiki-src/Source-Identity.md"; then
            echo "Remote Wiki Source-Identity.md did not survive push/readback."
            exit 1
          fi
          echo "Remote Wiki readback verified at ${remote_head}."
