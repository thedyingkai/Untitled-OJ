name: Staging Drill

on:
  schedule:
    - cron: "43 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore-rollback:
    name: Backup restore rollback staging drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: |
            platform/shared/go/go.sum
            services/auth-service/go.sum
            services/gateway/go.sum
            services/storage-service/go.sum
            services/problem-service/go.sum
            services/judge-api/go.sum
            services/user-service/go.sum
      - name: Run staging backup/restore/rollback drill
        shell: bash
        env:
          OJOS_EVIDENCE_DIR: artifacts/staging-drill
        run: bash deploy/ops/staging-drill.sh
      - name: Upload staging drill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-drill-evidence
          path: artifacts/staging-drill
