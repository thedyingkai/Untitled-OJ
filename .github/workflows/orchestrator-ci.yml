name: Orchestrator CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            platform/shared/go/go.sum
            services/auth-service/go.sum
            services/gateway/go.sum
            services/storage-service/go.sum
            services/problem-service/go.sum
            services/judge-api/go.sum
            services/user-service/go.sum
      - name: Start MinIO live integration service
        shell: bash
        env:
          MINIO_ROOT_USER: ojosminioaccess
          MINIO_ROOT_PASSWORD: OjosMinioLive_0123456789abcdef
        run: |
          set -euo pipefail
          docker run -d \
            --name ojos-ci-minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e "MINIO_ROOT_USER=$MINIO_ROOT_USER" \
            -e "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --console-address ":9001"
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ojos-ci-minio >&2 || true
          exit 1
      - name: Test Go modules
        shell: bash
        env:
          OJOS_REAL_REDIS_URL: redis://127.0.0.1:6379/0
          OJOS_REAL_MINIO_ENDPOINT: 127.0.0.1:9000
          OJOS_REAL_MINIO_ACCESS_KEY: ojosminioaccess
          OJOS_REAL_MINIO_SECRET_KEY: OjosMinioLive_0123456789abcdef
          OJOS_REAL_MINIO_USE_SSL: "false"
        run: |
          set -euo pipefail
          modules=(
            platform/shared/go
            services/auth-service
            services/gateway
            services/storage-service
            services/problem-service
            services/judge-api
            services/user-service
          )
          for dir in "${modules[@]}"; do
            echo "::group::go test $dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done
      - name: Scan Go modules for reachable vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            platform/shared/go
            services/auth-service
            services/gateway
            services/storage-service
            services/problem-service
            services/judge-api
            services/user-service
          )
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          for dir in "${modules[@]}"; do
            echo "::group::govulncheck $dir"
            (cd "$dir" && govulncheck ./...)
            echo "::endgroup::"
          done

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ojos-live-ci
          POSTGRES_DB: ojos_orchestrator_live
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ojos_orchestrator_live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Prepare PostgreSQL live schema
        shell: bash
        env:
          ORCHESTRATOR_DATABASE_URL: postgres://postgres:ojos-live-ci@127.0.0.1:55432/ojos_orchestrator_live?sslmode=disable
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$ORCHESTRATOR_DATABASE_URL" -f services/orchestrator/migrations/000001_orchestrator_schema.up.sql
      - name: Test Orchestrator workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo check --workspace --exclude ojos-orchestrator-desktop
          cargo test --workspace --exclude ojos-orchestrator-desktop
      - name: Discover, compile and verify Service Contract v3 services
        shell: bash
        run: |
          set -euo pipefail
          discovery="$(cargo run --quiet -p ojos-service -- service discover .)"
          printf '%s\n' "$discovery"
          service_count="$(printf '%s' "$discovery" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["services"]))')"
          if [[ "$service_count" -gt 0 ]]; then
            cargo run --quiet -p ojos-service -- service discover . --check-generated
          fi
      - name: Compile generated Go, Rust and TypeScript SDKs
        shell: bash
        run: |
          set -euo pipefail
          npm install --global typescript@5.9.2
          cargo test -p ojos-service --lib \
            codegen::tests::generated_go_rust_and_typescript_targets_compile \
            -- --ignored --exact
      - name: Test Orchestrator PostgreSQL live integration
        shell: bash
        env:
          ORCHESTRATOR_DATABASE_URL: postgres://postgres:ojos-live-ci@127.0.0.1:55432/ojos_orchestrator_live?sslmode=disable
          OJOS_REQUIRE_PG_LIVE: "1"
        run: |
          set -euo pipefail
          cargo test -p orchestrator-legacy --test pg_store_integration -- --test-threads=1
      - name: Start certificate-verifying PostgreSQL contract service
        shell: bash
        run: |
          set -euo pipefail
          certs="$RUNNER_TEMP/orchestrator-pg-tls"
          mkdir -p "$certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=OJOS CI PostgreSQL CA' -keyout "$certs/ca.key" -out "$certs/ca.crt"
          openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' \
            -keyout "$certs/server.key" -out "$certs/server.csr"
          cat >"$certs/server.ext" <<'EOF'
          subjectAltName=DNS:localhost,IP:127.0.0.1
          extendedKeyUsage=serverAuth
          EOF
          openssl x509 -req -days 1 -in "$certs/server.csr" \
            -CA "$certs/ca.crt" -CAkey "$certs/ca.key" -CAcreateserial \
            -extfile "$certs/server.ext" -out "$certs/server.crt"
          sudo chown 999:999 "$certs/server.key" "$certs/server.crt"
          sudo chmod 0600 "$certs/server.key"
          docker run -d --name ojos-orchestrator-pg-tls \
            -p 55433:5432 \
            -v "$certs:/certs:ro" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=ojos-tls-live-ci \
            -e POSTGRES_DB=ojos_orchestrator_tls \
            postgres:17 \
            -c ssl=on \
            -c ssl_cert_file=/certs/server.crt \
            -c ssl_key_file=/certs/server.key
          for attempt in {1..60}; do
            docker exec ojos-orchestrator-pg-tls pg_isready -U postgres -d ojos_orchestrator_tls && exit 0
            sleep 1
          done
          docker logs ojos-orchestrator-pg-tls >&2
          exit 1
      - name: Test pooled TLS PostgreSQL repository contract
        shell: bash
        env:
          OJOS_TEST_POSTGRES_URL: postgresql://postgres:ojos-tls-live-ci@127.0.0.1:55433/ojos_orchestrator_tls?sslmode=require
          OJOS_TEST_POSTGRES_CA: ${{ runner.temp }}/orchestrator-pg-tls/ca.crt
          OJOS_REQUIRE_POSTGRES_CONTRACT: "1"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/postgres-contract-output.txt"
          : >"$output"
          for test_name in \
            postgres_repository_contract_when_configured \
            postgres_legacy_upgrade_imports_draft_and_external_unknown_when_configured; do
            cargo test -p orchestrator-storage --test postgres_contract \
              "$test_name" -- --exact --test-threads=1 2>&1 | tee -a "$output"
          done
          cargo test -p orchestrator-storage --test contribution_contract \
            postgres_contribution_repository_contract_when_configured \
            -- --exact --test-threads=1 2>&1 | tee -a "$output"
          executed="$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$output")"
          if [[ "$executed" -ne 3 ]]; then
            echo "required PostgreSQL contract did not execute all three live tests" >&2
            exit 1
          fi
      - name: Verify required PostgreSQL contract cannot skip without DSN
        shell: bash
        env:
          OJOS_REQUIRE_POSTGRES_CONTRACT: "1"
        run: |
          set -euo pipefail
          if env -u OJOS_TEST_POSTGRES_URL \
            cargo test -p orchestrator-storage --test postgres_contract \
              postgres_repository_contract_when_configured -- --exact >"$RUNNER_TEMP/postgres-contract-missing-dsn.txt" 2>&1; then
            echo "required PostgreSQL contract silently skipped without its DSN" >&2
            exit 1
          fi
          grep -Fq 'OJOS_TEST_POSTGRES_URL must be set when OJOS_REQUIRE_POSTGRES_CONTRACT=1' \
            "$RUNNER_TEMP/postgres-contract-missing-dsn.txt"
      - name: Stop PostgreSQL contract service
        if: always()
        shell: bash
        run: docker rm -f ojos-orchestrator-pg-tls >/dev/null 2>&1 || true
      - name: Test judge worker
        shell: bash
        run: |
          set -euo pipefail
          cd services/judge-worker
          cargo fmt --check
          cargo check
          cargo test
      - name: Audit Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
          cargo audit --file services/judge-worker/Cargo.lock
      - name: Build nsjail for strict judge-worker live tests
        shell: bash
        env:
          NSJAIL_COMMIT: d6454b4640b6d8699b532a8afa37e4d67e477078
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            bison \
            flex \
            gcc \
            g++ \
            git \
            libnl-route-3-dev \
            libprotobuf-dev \
            libtool \
            make \
            openjdk-17-jdk \
            pkg-config \
            protobuf-compiler \
            python3
          git init /tmp/nsjail
          git -C /tmp/nsjail remote add origin https://github.com/google/nsjail.git
          git -C /tmp/nsjail fetch --depth=1 origin "$NSJAIL_COMMIT"
          git -C /tmp/nsjail checkout --detach FETCH_HEAD
          make -C /tmp/nsjail
          sudo cp /tmp/nsjail/nsjail /usr/local/bin/nsjail
          test -x /usr/local/bin/nsjail
          command -v nsjail
          nsjail --help >/tmp/nsjail-help.txt
      - name: Strict judge-worker nsjail live tests
        shell: bash
        run: |
          set -euo pipefail
          cd services/judge-worker
          sudo -E env \
            "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_TARGET_DIR=/tmp/ojos-judge-worker-live-target" \
            "OJOS_REQUIRE_NSJAIL_LIVE=1" \
            "OJOS_ALLOW_CGROUP_FALLBACK=false" \
            "OJOS_NSJAIL_NO_PIVOTROOT=false" \
            cargo test nsjail_ -- --test-threads=1

  frontend-build:
    name: Gateway frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/gateway/frontend/package-lock.json
      - name: Build gateway frontend
        working-directory: services/gateway/frontend
        run: |
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
          npm run build
      - name: Audit gateway frontend dependencies
        working-directory: services/gateway/frontend
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - name: Gateway frontend browser E2E
        working-directory: services/gateway/frontend
        run: |
          npm run test:e2e:install
          npm run test:e2e
      - name: Upload gateway frontend E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-frontend-e2e
          path: |
            services/gateway/frontend/playwright-report
            services/gateway/frontend/test-results

  orchestrator-web-build:
    name: Orchestrator Web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11"
          cache: npm
          cache-dependency-path: manager/web/package-lock.json
      - name: Build orchestrator Web UI
        working-directory: manager/web
        run: |
          set -euo pipefail
          npm ci --registry=https://registry.npmjs.org
          npm run typecheck
          npm test
          npm run build
          test -f dist/index.html

  orchestrator-desktop-build:
    name: Desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: "24.11"
          cache: npm
          cache-dependency-path: manager/web/package-lock.json
      - name: Install Linux WebView build dependencies
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget \
            xauth \
            xvfb
      - name: Build Web control surface
        working-directory: manager/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --registry=https://registry.npmjs.org
          npm run typecheck
          npm test
          npm run build
          test -f dist/index.html
      - name: Test and build desktop app
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ojos-orchestrator-desktop --lib
          cargo build -p ojos-orchestrator-desktop
      - name: Smoke-test embedded desktop app (Linux)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: xvfb-run -a env OJOS_DESKTOP_SMOKE=1 ./target/debug/ojos-orchestrator-desktop --repo-root "$PWD"
      - name: Smoke-test embedded desktop app (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $env:OJOS_DESKTOP_SMOKE = "1"
          & .\target\debug\ojos-orchestrator-desktop.exe --repo-root $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  compose-policy:
    name: Docker Compose production policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Prometheus configuration and alert rules
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/deploy/ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            -v "/etc/ssl/certs/ca-certificates.crt:/etc/prometheus/tls/orchestrator-ca.crt:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/deploy/ops/monitoring:/etc/ojos-monitoring:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.55.1 \
            check rules /etc/ojos-monitoring/alerts.yml
          docker run --rm \
            -w /etc/ojos-monitoring \
            -v "$PWD/deploy/ops/monitoring:/etc/ojos-monitoring:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.55.1 \
            test rules alert-tests.yml
      - name: Judge worker compose defaults
        shell: bash
        env:
          AUTH_POSTGRES_PASSWORD: static-compose-auth-password
          AUTH_DATABASE_URL: postgres://postgres:static-compose-auth-password@auth-db:5432/ojos_auth?sslmode=disable
          PROBLEM_POSTGRES_PASSWORD: static-compose-problem-password
          PROBLEM_DATABASE_URL: postgres://postgres:static-compose-problem-password@problem-db:5432/ojos_problem?sslmode=disable
          JUDGE_POSTGRES_PASSWORD: static-compose-judge-password
          JUDGE_DATABASE_URL: postgres://postgres:static-compose-judge-password@judge-db:5432/ojos_judge?sslmode=disable
          USER_POSTGRES_PASSWORD: static-compose-user-password
          USER_DATABASE_URL: postgres://postgres:static-compose-user-password@user-db:5432/ojos_user?sslmode=disable
          ORCHESTRATOR_POSTGRES_PASSWORD: static-compose-orchestrator-password
          ORCHESTRATOR_DATABASE_URL: postgres://postgres:static-compose-orchestrator-password@orchestrator-db:5432/ojos_orchestrator?sslmode=disable
          JWT_SECRET: static-compose-jwt-secret
          AUTH_INTERNAL_TOKEN: static-compose-internal-token
          OJOS_WORKER_TOKEN: static-compose-worker-token
          MINIO_ROOT_USER: static-compose-minio-user
          MINIO_ROOT_PASSWORD: static-compose-minio-password
        run: |
          set -euo pipefail
          rendered="$(docker compose --profile legacy-development --env-file .env.example -f deploy/compose/docker-compose.yml config)"
          printf '%s\n' "$rendered" >/tmp/ojos-compose-rendered.yml
          if ! grep -q 'OJOS_RUNNER_MODE: nsjail' /tmp/ojos-compose-rendered.yml; then
            echo "judge-worker must render with OJOS_RUNNER_MODE=nsjail" >&2
            exit 1
          fi
          if grep -q 'OJOS_ALLOW_CGROUP_FALLBACK: "true"' /tmp/ojos-compose-rendered.yml || grep -q 'OJOS_ALLOW_CGROUP_FALLBACK: true' /tmp/ojos-compose-rendered.yml; then
            echo "judge-worker must not default to cgroup fallback" >&2
            exit 1
          fi
          docker compose --profile legacy-development --env-file .env.example -f deploy/compose/docker-compose.yml config --quiet

      - name: Production ops gates
        shell: bash
        run: bash deploy/ops/ci-policy.sh

  orchestrator-model-checks:
    name: Orchestrator model checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Orchestrator model checks
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p orchestrator-core checked_in_service_manifests_validate
          cargo test -p orchestrator-core checked_in_sets_reference_existing_services
          cargo test -p orchestrator-core action_registry_contains_required_actions_and_no_forbidden_actions
          cargo test -p orchestrator-core form_registry_covers_every_action
          cargo test -p orchestrator-core service_install_operation_uses_operation_model
          cargo test -p orchestrator-core set_validate_and_expand
