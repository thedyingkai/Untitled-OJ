name: Orchestrator Docker E2E

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      run_docker_build:
        description: "Build Docker images"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  docker-e2e:
    name: Docker E2E production gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ojos-live-ci
          POSTGRES_DB: ojos_orchestrator_live
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ojos_orchestrator_live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/gateway/frontend/package-lock.json

      - name: Boundary note
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is a production gate for Docker, live dependencies, and release/runtime policy."
          echo "It does not upload .env files, temporary files, release artifacts, tokens, or logs."
          echo "Scheduled runs build all production service images."

      - name: Prepare PostgreSQL live schema
        shell: bash
        env:
          ORCHESTRATOR_DATABASE_URL: postgres://postgres:ojos-live-ci@127.0.0.1:55432/ojos_orchestrator_live?sslmode=disable
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$ORCHESTRATOR_DATABASE_URL" -f services/orchestrator/migrations/000001_orchestrator_schema.up.sql
      - name: Rust checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo check
          cargo test
          cd services/judge-worker
          cargo fmt --check
          cargo check
          cargo test
      - name: Orchestrator PostgreSQL live integration
        shell: bash
        env:
          ORCHESTRATOR_DATABASE_URL: postgres://postgres:ojos-live-ci@127.0.0.1:55432/ojos_orchestrator_live?sslmode=disable
          OJOS_REQUIRE_PG_LIVE: "1"
        run: |
          set -euo pipefail
          cargo test -p orchestrator-core --test pg_store_integration -- --test-threads=1

      - name: Build nsjail for strict judge-worker live tests
        shell: bash
        env:
          NSJAIL_COMMIT: d6454b4640b6d8699b532a8afa37e4d67e477078
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            bison \
            flex \
            gcc \
            g++ \
            git \
            libnl-route-3-dev \
            libprotobuf-dev \
            libtool \
            make \
            openjdk-17-jdk \
            pkg-config \
            protobuf-compiler \
            python3
          git init /tmp/nsjail
          git -C /tmp/nsjail remote add origin https://github.com/google/nsjail.git
          git -C /tmp/nsjail fetch --depth=1 origin "$NSJAIL_COMMIT"
          git -C /tmp/nsjail checkout --detach FETCH_HEAD
          make -C /tmp/nsjail
          sudo cp /tmp/nsjail/nsjail /usr/local/bin/nsjail
          test -x /usr/local/bin/nsjail
          command -v nsjail
          nsjail --help >/tmp/nsjail-help.txt

      - name: Strict judge-worker nsjail live tests
        shell: bash
        run: |
          set -euo pipefail
          cd services/judge-worker
          sudo -E env \
            "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_TARGET_DIR=/tmp/ojos-judge-worker-live-target" \
            "OJOS_REQUIRE_NSJAIL_LIVE=1" \
            "OJOS_ALLOW_CGROUP_FALLBACK=false" \
            "OJOS_NSJAIL_NO_PIVOTROOT=false" \
            cargo test nsjail_ -- --test-threads=1

      - name: Start MinIO live integration service
        shell: bash
        env:
          MINIO_ROOT_USER: ojosminioaccess
          MINIO_ROOT_PASSWORD: OjosMinioLive_0123456789abcdef
        run: |
          set -euo pipefail
          docker run -d \
            --name ojos-e2e-minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e "MINIO_ROOT_USER=$MINIO_ROOT_USER" \
            -e "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --console-address ":9001"
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ojos-e2e-minio >&2 || true
          exit 1

      - name: Go checks
        shell: bash
        env:
          OJOS_REAL_REDIS_URL: redis://127.0.0.1:6379/0
          OJOS_REAL_MINIO_ENDPOINT: 127.0.0.1:9000
          OJOS_REAL_MINIO_ACCESS_KEY: ojosminioaccess
          OJOS_REAL_MINIO_SECRET_KEY: OjosMinioLive_0123456789abcdef
          OJOS_REAL_MINIO_USE_SSL: "false"
        run: |
          set -euo pipefail
          modules=(
            platform/shared/go
            services/auth-service
            services/gateway
            services/storage-service
            services/problem-service
            services/judge-api
            services/user-service
          )
          for dir in "${modules[@]}"; do
            echo "::group::go test $dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done

      - name: Gateway frontend checks
        working-directory: services/gateway/frontend
        run: |
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
          npm audit --registry=https://registry.npmjs.org --audit-level=high
          npm run build

      - name: Orchestrator model checks
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p orchestrator-core checked_in_service_manifests_validate
          cargo test -p orchestrator-core checked_in_sets_reference_existing_services
          cargo test -p orchestrator-core action_registry_contains_required_actions_and_no_forbidden_actions
          cargo test -p orchestrator-core form_registry_covers_every_action
          cargo test -p orchestrator-core set_validate_and_expand

      - name: Docker Compose config check
        env:
          AUTH_POSTGRES_PASSWORD: static-compose-auth-password
          AUTH_DATABASE_URL: postgres://postgres:static-compose-auth-password@auth-db:5432/ojos_auth?sslmode=disable
          PROBLEM_POSTGRES_PASSWORD: static-compose-problem-password
          PROBLEM_DATABASE_URL: postgres://postgres:static-compose-problem-password@problem-db:5432/ojos_problem?sslmode=disable
          JUDGE_POSTGRES_PASSWORD: static-compose-judge-password
          JUDGE_DATABASE_URL: postgres://postgres:static-compose-judge-password@judge-db:5432/ojos_judge?sslmode=disable
          USER_POSTGRES_PASSWORD: static-compose-user-password
          USER_DATABASE_URL: postgres://postgres:static-compose-user-password@user-db:5432/ojos_user?sslmode=disable
          ORCHESTRATOR_POSTGRES_PASSWORD: static-compose-orchestrator-password
          ORCHESTRATOR_DATABASE_URL: postgres://postgres:static-compose-orchestrator-password@orchestrator-db:5432/ojos_orchestrator?sslmode=disable
          JWT_SECRET: static-compose-jwt-secret
          AUTH_INTERNAL_TOKEN: static-compose-internal-token
          OJOS_WORKER_TOKEN: static-compose-worker-token
          MINIO_ROOT_USER: static-compose-minio-user
          MINIO_ROOT_PASSWORD: static-compose-minio-password
        shell: bash
        run: |
          set -euo pipefail
          rendered="$(docker compose --env-file .env.example -f deploy/compose/docker-compose.yml config)"
          printf '%s\n' "$rendered" >/tmp/ojos-compose-rendered.yml
          if ! grep -q 'OJOS_RUNNER_MODE: nsjail' /tmp/ojos-compose-rendered.yml; then
            echo "judge-worker must render with OJOS_RUNNER_MODE=nsjail" >&2
            exit 1
          fi
          if grep -q 'OJOS_ALLOW_CGROUP_FALLBACK: "true"' /tmp/ojos-compose-rendered.yml || grep -q 'OJOS_ALLOW_CGROUP_FALLBACK: true' /tmp/ojos-compose-rendered.yml; then
            echo "judge-worker must not default to cgroup fallback" >&2
            exit 1
          fi
          docker compose --env-file .env.example -f deploy/compose/docker-compose.yml config --quiet

      - name: Production ops gates
        shell: bash
        run: bash deploy/ops/ci-policy.sh

      - name: Docker image build
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_docker_build == 'true') }}
        env:
          AUTH_POSTGRES_PASSWORD: static-compose-auth-password
          AUTH_DATABASE_URL: postgres://postgres:static-compose-auth-password@auth-db:5432/ojos_auth?sslmode=disable
          PROBLEM_POSTGRES_PASSWORD: static-compose-problem-password
          PROBLEM_DATABASE_URL: postgres://postgres:static-compose-problem-password@problem-db:5432/ojos_problem?sslmode=disable
          JUDGE_POSTGRES_PASSWORD: static-compose-judge-password
          JUDGE_DATABASE_URL: postgres://postgres:static-compose-judge-password@judge-db:5432/ojos_judge?sslmode=disable
          USER_POSTGRES_PASSWORD: static-compose-user-password
          USER_DATABASE_URL: postgres://postgres:static-compose-user-password@user-db:5432/ojos_user?sslmode=disable
          ORCHESTRATOR_POSTGRES_PASSWORD: static-compose-orchestrator-password
          ORCHESTRATOR_DATABASE_URL: postgres://postgres:static-compose-orchestrator-password@orchestrator-db:5432/ojos_orchestrator?sslmode=disable
          JWT_SECRET: static-compose-jwt-secret
          AUTH_INTERNAL_TOKEN: static-compose-internal-token
          OJOS_WORKER_TOKEN: static-compose-worker-token
          MINIO_ROOT_USER: static-compose-minio-user
          MINIO_ROOT_PASSWORD: static-compose-minio-password
        shell: bash
        run: |
          set -euo pipefail
          services=(orchestrator auth-service storage-service gateway problem-service judge-api judge-worker user-service)
          docker compose --env-file .env.example -f deploy/compose/docker-compose.yml build "${services[@]}"
          mkdir -p artifacts/image-build
          docker compose --env-file .env.example -f deploy/compose/docker-compose.yml images >artifacts/image-build/docker-compose-images.txt
          if docker compose --env-file .env.example -f deploy/compose/docker-compose.yml images --format json >artifacts/image-build/docker-compose-images.jsonl 2>/dev/null; then
            jq -s '.' artifacts/image-build/docker-compose-images.jsonl >artifacts/image-build/docker-compose-images.json
          else
            jq -n --arg note "docker compose images --format json is unavailable on this runner; see docker-compose-images.txt" '{note: $note}' >artifacts/image-build/docker-compose-images.json
          fi
          jq -n \
            --arg commit "${GITHUB_SHA:-local}" \
            --arg build_time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg services "$(IFS=,; echo "${services[*]}")" \
            --rawfile compose_images artifacts/image-build/docker-compose-images.txt \
            --rawfile runtime_lock services/judge-worker/config/runtime-lock.yaml \
            '{
              commit: $commit,
              build_time: $build_time,
              services: ($services | split(",")),
              base_image_digest: "not recorded by docker compose build; image tags are pinned and compose image list is attached",
              compose_images: $compose_images,
              judge_worker_runtime_lock: $runtime_lock
            }' >artifacts/image-build/image-build-evidence.json
      - name: Upload Docker image build evidence
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_docker_build == 'true')) }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-build-evidence
          path: artifacts/image-build
