[workspace]
members = [
    "tools/ojos-service",
    "platform/shared/rust/service-context",
    "services/orchestrator/core",
    "services/orchestrator/legacy",
    "services/orchestrator/control-plane",
    "services/orchestrator/storage",
    "services/orchestrator/runtime",
    "services/orchestrator/agent",
    "services/orchestrator/manager",
    "services/orchestrator/backend",
    "manager/installer",
    "manager/desktop",
    "manager/tui",
]
exclude = [
    "services/judge-worker",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "1.0.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
orchestrator-core = { path = "services/orchestrator/core" }
orchestrator-legacy = { path = "services/orchestrator/legacy" }
orchestrator-control-plane = { path = "services/orchestrator/control-plane" }
orchestrator-storage = { path = "services/orchestrator/storage" }
orchestrator-runtime = { path = "services/orchestrator/runtime" }
orchestrator-agent = { path = "services/orchestrator/agent" }
orchestrator-manager = { path = "services/orchestrator/manager" }
ojos-orchestrator-installer = { path = "manager/installer" }
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
jsonschema = { version = "0.49", default-features = false }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
url = "2"
ratatui = "0.30"
crossterm = "0.29"
