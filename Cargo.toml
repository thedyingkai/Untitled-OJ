[workspace]
members = [
    "orchestrator/core",
    "orchestrator/gui",
    "orchestrator/tui",
]
exclude = [
    "services/judge-worker",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.31"
orchestrator-core = { path = "orchestrator/core" }
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
ratatui = "0.29"
crossterm = "0.29"
