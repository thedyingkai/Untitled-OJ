services:
  judge-worker:
    build:
      context: ../../services
      dockerfile: judge-worker/Dockerfile
    restart: unless-stopped
    environment:
      LANGUAGES_CONFIG: config/languages.yaml
      OJOS_WORKER_ID: ${OJOS_WORKER_ID}
      OJOS_WORKER_NAME: ${OJOS_WORKER_NAME}
      OJOS_JUDGE_API_URL: ${OJOS_JUDGE_API_URL}
      OJOS_WORKER_TOKEN: ${OJOS_WORKER_TOKEN}
      OJOS_MAX_CONCURRENCY: ${OJOS_MAX_CONCURRENCY:-1}
      OJOS_WORK_DIR: /var/lib/ojos-worker/work
      OJOS_ARTIFACT_CACHE_DIR: /var/lib/ojos-worker/cache
      OJOS_SUPPORTED_LANGUAGES: ${OJOS_SUPPORTED_LANGUAGES:-cpp17,c11,python3,java17}
      OJOS_HEARTBEAT_INTERVAL: ${OJOS_HEARTBEAT_INTERVAL:-10}
      OJOS_TASK_LEASE_TTL: ${OJOS_TASK_LEASE_TTL:-60}
      OJOS_ALLOW_CGROUP_FALLBACK: ${OJOS_ALLOW_CGROUP_FALLBACK:-true}
      RUST_LOG: ${OJOS_LOG_LEVEL:-info}
    volumes:
      - worker-data:/var/lib/ojos-worker

volumes:
  worker-data:
