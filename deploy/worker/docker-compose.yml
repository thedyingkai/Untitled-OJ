# DEVELOPMENT COMPATIBILITY ONLY.
#
# Production Judge Workers are installed by Orchestrator from the signed
# Service Contract v2 release. The Agent then supplies the fixed
# judge-sandbox-v1 HostConfig and a read-only /run/ojos/service context.
# This Compose file deliberately keeps the legacy URL + shared worker token
# path so local developers can run a worker without a control plane.
services:
  judge-worker:
    profiles: [ "legacy-development" ]
    build:
      context: ../..
      dockerfile: services/judge-worker/Dockerfile
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_CHROOT
    privileged: true
    cgroup: host
    security_opt:
      - apparmor=unconfined
    environment:
      OJOS_ENVIRONMENT: development
      LANGUAGES_CONFIG: config/languages.yaml
      OJOS_WORKER_ID: ${OJOS_WORKER_ID}
      OJOS_WORKER_NAME: ${OJOS_WORKER_NAME}
      OJOS_JUDGE_API_URL: ${OJOS_JUDGE_API_URL}
      OJOS_WORKER_TOKEN: ${OJOS_WORKER_TOKEN}
      OJOS_MAX_CONCURRENCY: ${OJOS_MAX_CONCURRENCY:-1}
      OJOS_WORK_DIR: /var/lib/ojos-worker/work
      OJOS_ARTIFACT_CACHE_DIR: /var/lib/ojos-worker/cache
      OJOS_SUPPORTED_LANGUAGES: ${OJOS_SUPPORTED_LANGUAGES:-cpp17,c11,python3,java17}
      OJOS_HEARTBEAT_INTERVAL: ${OJOS_HEARTBEAT_INTERVAL:-10}
      OJOS_TASK_LEASE_TTL: ${OJOS_TASK_LEASE_TTL:-60}
      OJOS_RUNNER_MODE: ${OJOS_RUNNER_MODE:-nsjail}
      OJOS_ALLOW_CGROUP_FALLBACK: ${OJOS_ALLOW_CGROUP_FALLBACK:-false}
      OJOS_NSJAIL_NO_PIVOTROOT: ${OJOS_NSJAIL_NO_PIVOTROOT:-false}
      RUST_LOG: ${OJOS_LOG_LEVEL:-info}
    volumes:
      - worker-data:/var/lib/ojos-worker
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

volumes:
  worker-data:
