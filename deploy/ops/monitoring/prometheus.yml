global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: postgres-exporters
    static_configs:
      - targets:
          - postgres-exporter-orchestrator:9187
        labels:
          database: orchestrator

  - job_name: ojos-active-services
    honor_labels: true
    http_sd_configs:
      - url: https://orchestrator:8090/internal/v1/observability/metrics/targets
        refresh_interval: 15s
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/orchestrator-observability-token
        tls_config:
          ca_file: /etc/prometheus/tls/orchestrator-ca.crt
          server_name: orchestrator
    relabel_configs:
      - source_labels: [__scheme__]
        regex: https?
        action: keep
    tls_config:
      ca_file: /etc/prometheus/tls/gateway-ca.crt

  - job_name: ojos-orchestrator
    scheme: https
    metrics_path: /internal/v1/observability/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/orchestrator-observability-token
    tls_config:
      ca_file: /etc/prometheus/tls/orchestrator-ca.crt
      server_name: orchestrator
    static_configs:
      - targets:
          - orchestrator:8090
        labels:
          service: orchestrator

  - job_name: ojos-health
    metrics_path: /probe
    params:
      module:
        - http_2xx
    http_sd_configs:
      - url: https://orchestrator:8090/internal/v1/observability/health/targets
        refresh_interval: 15s
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/orchestrator-observability-token
        tls_config:
          ca_file: /etc/prometheus/tls/orchestrator-ca.crt
          server_name: orchestrator
    static_configs:
      - targets:
          - https://orchestrator:8090/api/v1/healthz/ready
        labels:
          service: orchestrator
      - targets:
          - http://minio:9000/minio/health/live
        labels:
          service: minio
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - source_labels:
          - service
        regex: orchestrator
        target_label: __param_module
        replacement: http_2xx_orchestrator_tls
      - source_labels:
          - source
        regex: explicit-platform
        target_label: __param_module
        replacement: http_2xx_gateway_tls
      - target_label: __address__
        replacement: blackbox-exporter:9115
