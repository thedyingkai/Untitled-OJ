services:
  orchestrator-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${ORCHESTRATOR_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${ORCHESTRATOR_POSTGRES_PASSWORD:-ojos-orchestrator-local}
      POSTGRES_DB: ${ORCHESTRATOR_POSTGRES_DB:-ojos_orchestrator}
    volumes:
      - orchestrator-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ojos-local}
      POSTGRES_DB: ${POSTGRES_DB:-ojos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: [ "redis-server", "--appendonly", "yes" ]

  orchestrator-migrations:
    image: migrate/migrate:v4.18.3
    depends_on:
      orchestrator-db:
        condition: service_healthy
    volumes:
      - ../orchestrator-migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${ORCHESTRATOR_DATABASE_URL:-postgres://postgres:ojos-orchestrator-local@orchestrator-db:5432/ojos_orchestrator?sslmode=disable}", "up" ]

  oj-migrations:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../oj-migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${OJ_DATABASE_URL:-postgres://postgres:ojos-local@postgres:5432/ojos?sslmode=disable}", "up" ]

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:14268:14268"

  gateway:
    build:
      context: ../../services
      dockerfile: gateway/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      oj-migrations:
        condition: service_completed_successfully
      problem-api:
        condition: service_started
    environment:
      DATABASE_URL: ${OJ_DATABASE_URL:-postgres://postgres:ojos-local@postgres:5432/ojos?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-ojos-local-jwt}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      OJOS_PROBLEMS_ROOT: /data/ojos/problems
      OJOS_SUBMISSIONS_ROOT: /data/ojos/submissions
    ports:
      - "8080:8080"
    volumes:
      - ../../storage/problems:/data/ojos/problems:ro
      - ../../storage/submissions:/data/ojos/submissions:ro

  auth:
    build:
      context: ../../services
      dockerfile: auth/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      oj-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    expose:
      - "8081"
    environment:
      DATABASE_URL: ${OJ_DATABASE_URL:-postgres://postgres:ojos-local@postgres:5432/ojos?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-ojos-local-jwt}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}

  judge-api:
    build:
      context: ../../services
      dockerfile: judge-api/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      oj-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    expose:
      - "8082"
    environment:
      DATABASE_URL: ${OJ_DATABASE_URL:-postgres://postgres:ojos-local@postgres:5432/ojos?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      OJOS_SUBMISSIONS_ROOT: /data/ojos/submissions
      OJOS_WORKER_TOKEN: ${OJOS_WORKER_TOKEN:-ojos-local-worker}
    volumes:
      - ../../storage/submissions:/data/ojos/submissions
      - ../../storage/problems:/data/ojos/problems:ro

  judge-worker:
    build:
      context: ../../services
      dockerfile: judge-worker/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    depends_on:
      gateway:
        condition: service_started
    environment:
      LANGUAGES_CONFIG: config/languages.yaml
      OJOS_JUDGE_API_URL: http://judge-api:8082
      OJOS_WORKER_TOKEN: ${OJOS_WORKER_TOKEN:-ojos-local-worker}
      OJOS_MAX_CONCURRENCY: 1
      OJOS_WORK_DIR: /var/lib/ojos-worker/work
      OJOS_ARTIFACT_CACHE_DIR: /var/lib/ojos-worker/cache
      OJOS_SUPPORTED_LANGUAGES: cpp17,c11,python3,java17
      OJOS_HEARTBEAT_INTERVAL: 10
      OJOS_TASK_LEASE_TTL: 60
      OJOS_ALLOW_CGROUP_FALLBACK: ${OJOS_ALLOW_CGROUP_FALLBACK:-true}
      OJOS_NSJAIL_NO_PIVOTROOT: ${OJOS_NSJAIL_NO_PIVOTROOT:-false}
      RUST_LOG: info
    volumes:
      - worker-data:/var/lib/ojos-worker

  problem-api:
    build:
      context: ../../services
      dockerfile: problem-api/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      oj-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    expose:
      - "8083"
    environment:
      DATABASE_URL: ${OJ_DATABASE_URL:-postgres://postgres:ojos-local@postgres:5432/ojos?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      OJOS_PROBLEMS_ROOT: /data/ojos/problems
    volumes:
      - ../../storage/problems:/data/ojos/problems

volumes:
  orchestrator-db-data:
  postgres-data:
  worker-data:
