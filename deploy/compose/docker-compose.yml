services:
  orchestrator-db:
    image: postgres:17
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${ORCHESTRATOR_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${ORCHESTRATOR_POSTGRES_PASSWORD:-ojos-orchestrator-local}
      POSTGRES_DB: ${ORCHESTRATOR_POSTGRES_DB:-ojos_orchestrator}
    volumes:
      - orchestrator-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-ojos-auth-local}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-ojos_auth}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  problem-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PROBLEM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PROBLEM_POSTGRES_PASSWORD:-ojos-problem-local}
      POSTGRES_DB: ${PROBLEM_POSTGRES_DB:-ojos_problem}
    volumes:
      - problem-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  judge-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${JUDGE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${JUDGE_POSTGRES_PASSWORD:-ojos-judge-local}
      POSTGRES_DB: ${JUDGE_POSTGRES_DB:-ojos_judge}
    volumes:
      - judge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${USER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD:-ojos-user-local}
      POSTGRES_DB: ${USER_POSTGRES_DB:-ojos_user}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-DEV_ONLY_redis_password_not_for_production}" ]
    ports:
      - "127.0.0.1:6379:6379"

  orchestrator-migrations:
    image: migrate/migrate:v4.18.3
    depends_on:
      orchestrator-db:
        condition: service_healthy
    volumes:
      - ../../services/orchestrator/migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${ORCHESTRATOR_DATABASE_URL:-postgres://postgres:ojos-orchestrator-local@orchestrator-db:5432/ojos_orchestrator?sslmode=disable}", "up" ]

  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/backend/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
    depends_on:
      orchestrator-migrations:
        condition: service_completed_successfully
    environment:
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-postgres://postgres:ojos-orchestrator-local@orchestrator-db:5432/ojos_orchestrator?sslmode=disable}
      ORCHESTRATOR_RELEASE_PACKAGE_LOAD: "1"
      ORCHESTRATOR_RELEASE_PACKAGE_ROOT: /workspace
      ORCHESTRATOR_AUTH_PERMISSION_SYNC: "1"
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8081}
      AUTH_SERVICE_ADMIN_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      ORCHESTRATOR_GATEWAY_ROUTE_PUBLISH: "0"
    ports:
      - "127.0.0.1:8090:8090"
    expose:
      - "8090"

  auth-service-migrations:
    image: migrate/migrate:v4.18.3
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ../../services/auth-service/migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${AUTH_DATABASE_URL:-postgres://postgres:ojos-auth-local@auth-db:5432/ojos_auth?sslmode=disable}", "up" ]

  problem-service-migrations:
    image: migrate/migrate:v4.18.3
    depends_on:
      problem-db:
        condition: service_healthy
    volumes:
      - ../../services/problem-service/migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${PROBLEM_DATABASE_URL:-postgres://postgres:ojos-problem-local@problem-db:5432/ojos_problem?sslmode=disable}", "up" ]

  judge-api-migrations:
    image: migrate/migrate:v4.18.3
    depends_on:
      judge-db:
        condition: service_healthy
    volumes:
      - ../../services/judge-api/migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${JUDGE_DATABASE_URL:-postgres://postgres:ojos-judge-local@judge-db:5432/ojos_judge?sslmode=disable}", "up" ]

  user-service-migrations:
    image: migrate/migrate:v4.18.3
    depends_on:
      user-db:
        condition: service_healthy
    volumes:
      - ../../services/user-service/migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${USER_DATABASE_URL:-postgres://postgres:ojos-user-local@user-db:5432/ojos_user?sslmode=disable}", "up" ]

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:14268:14268"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ojos-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ojos-minio-local}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      auth-service:
        condition: service_started
      orchestrator:
        condition: service_started
    environment:
      REDIS_URL: ${REDIS_URL:-redis://:DEV_ONLY_redis_password_not_for_production@redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-ojos-local-jwt}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8081}
      ORCHESTRATOR_ENDPOINT: ${ORCHESTRATOR_ENDPOINT:-http://orchestrator:8090}
      ORCHESTRATOR_INTERNAL_TOKEN: ${ORCHESTRATOR_INTERNAL_TOKEN:-ojos-local-internal}
      ORCHESTRATOR_NODE_ID: ${ORCHESTRATOR_NODE_ID:-child-node}
      OJOS_PROBLEMS_ROOT: /data/ojos/problems
      OJOS_SUBMISSIONS_ROOT: /data/ojos/submissions
    ports:
      - "8080:8080"
    volumes:
      - ../../storage/problems:/data/ojos/problems:ro
      - ../../storage/submissions:/data/ojos/submissions:ro

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      auth-service-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    expose:
      - "8081"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgres://postgres:ojos-auth-local@auth-db:5432/ojos_auth?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-ojos-local-jwt}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      user-service-migrations:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      storage-service:
        condition: service_started
    expose:
      - "8084"
    environment:
      DATABASE_URL: ${USER_DATABASE_URL:-postgres://postgres:ojos-user-local@user-db:5432/ojos_user?sslmode=disable}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8081}
      AUTH_SERVICE_ADMIN_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}

  storage-service:
    build:
      context: ../..
      dockerfile: services/storage-service/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    expose:
      - "8085"
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      minio:
        condition: service_started
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      OJOS_STORAGE_ROOT: /data/ojos/storage
      OJOS_STORAGE_BUCKETS: problems,submissions,judge-artifacts,avatars
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ojos-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ojos-minio-local}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    volumes:
      - storage-service-data:/data/ojos/storage

  judge-api:
    build:
      context: ../..
      dockerfile: services/judge-api/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      judge-db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8082"
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      DATABASE_URL: ${JUDGE_DATABASE_URL:-postgres://postgres:ojos-judge-local@judge-db:5432/ojos_judge?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://:DEV_ONLY_redis_password_not_for_production@redis:6379/0}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8081}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      OJOS_SUBMISSIONS_ROOT: /data/ojos/submissions
      OJOS_WORKER_TOKEN: ${OJOS_WORKER_TOKEN:-ojos-local-worker}
      OJOS_INTERNAL_GATEWAY_ENDPOINT: http://gateway:8080
      OJOS_STORAGE_OBJECT_GET_API_ID: storage.object.get
      OJOS_STORAGE_OBJECT_PUT_API_ID: storage.object.put
      OJOS_STORAGE_OBJECT_HEAD_API_ID: storage.object.head
      OJOS_SERVICE_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      OJOS_CALLER_SERVICE: judge-api
      OJOS_CALLER_NODE_ID: ${OJOS_CALLER_NODE_ID:-child-node}
    volumes:
      - ../../storage/submissions:/data/ojos/submissions
      - ../../storage/problems:/data/ojos/problems:ro

  judge-worker:
    build:
      context: ../..
      dockerfile: services/judge-worker/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
    depends_on:
      judge-api:
        condition: service_started
      problem-service:
        condition: service_started
      redis:
        condition: service_started
      storage-service:
        condition: service_started
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_CHROOT
    privileged: true
    cgroup: host
    security_opt:
      - apparmor=unconfined
    environment:
      LANGUAGES_CONFIG: config/languages.yaml
      OJOS_JUDGE_API_URL: http://judge-api:8082
      OJOS_INTERNAL_GATEWAY_URL: http://gateway:8080
      OJOS_STORAGE_OBJECT_GET_API_ID: storage.object.get
      OJOS_STORAGE_OBJECT_PUT_API_ID: storage.object.put
      OJOS_REDIS_URL: ${REDIS_URL:-redis://:DEV_ONLY_redis_password_not_for_production@redis:6379/0}
      OJOS_JUDGE_TASK_STREAM: ojos:judge:task
      OJOS_JUDGE_CONSUMER_GROUP: judge-worker
      OJOS_RUNNER_MODE: ${OJOS_RUNNER_MODE:-nsjail}
      OJOS_WORKER_TOKEN: ${OJOS_WORKER_TOKEN:-ojos-local-worker}
      OJOS_SERVICE_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      OJOS_CALLER_NODE_ID: ${OJOS_CALLER_NODE_ID:-child-node}
      OJOS_MAX_CONCURRENCY: 1
      OJOS_WORK_DIR: /var/lib/ojos-worker/work
      OJOS_ARTIFACT_CACHE_DIR: /var/lib/ojos-worker/cache
      OJOS_SUPPORTED_LANGUAGES: cpp17,c11,python3,java17
      OJOS_HEARTBEAT_INTERVAL: 10
      OJOS_TASK_LEASE_TTL: 60
      OJOS_ALLOW_CGROUP_FALLBACK: ${OJOS_ALLOW_CGROUP_FALLBACK:-false}
      OJOS_NSJAIL_NO_PIVOTROOT: ${OJOS_NSJAIL_NO_PIVOTROOT:-false}
      RUST_LOG: info
    volumes:
      - worker-data:/var/lib/ojos-worker
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  problem-service:
    build:
      context: ../..
      dockerfile: services/problem-service/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      problem-service-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      storage-service:
        condition: service_started
      jaeger:
        condition: service_started
    expose:
      - "8083"
    environment:
      DATABASE_URL: ${PROBLEM_DATABASE_URL:-postgres://postgres:ojos-problem-local@problem-db:5432/ojos_problem?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://:DEV_ONLY_redis_password_not_for_production@redis:6379/0}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8081}
      AUTH_SERVICE_ADMIN_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      OJOS_PROBLEMS_ROOT: /data/ojos/problems
      OJOS_STORAGE_SERVICE_URL: http://storage-service:8085
      OJOS_INTERNAL_GATEWAY_URL: http://gateway:8080
      OJOS_STORAGE_OBJECT_PUT_API_ID: storage.object.put
      OJOS_PROBLEM_STORAGE_BUCKET: problems
      OJOS_SERVICE_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      OJOS_CALLER_SERVICE: problem-service
      OJOS_CALLER_NODE_ID: ${OJOS_CALLER_NODE_ID:-child-node}
    volumes:
      - ../../storage/problems:/data/ojos/problems

volumes:
  orchestrator-db-data:
  auth-db-data:
  problem-db-data:
  judge-db-data:
  user-db-data:
  minio-data:
  storage-service-data:
  worker-data:

