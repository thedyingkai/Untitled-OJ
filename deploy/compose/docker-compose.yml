services:
  orchestrator-db:
    image: postgres:17
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${ORCHESTRATOR_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${ORCHESTRATOR_POSTGRES_PASSWORD:-ojos-orchestrator-local}
      POSTGRES_DB: ${ORCHESTRATOR_POSTGRES_DB:-ojos_orchestrator}
    volumes:
      - orchestrator-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ platform-control ]

  auth-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:?set the platform Auth PostgreSQL role}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?set the platform Auth PostgreSQL password}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:?set the platform Auth PostgreSQL database}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ platform-control ]

  problem-db:
    profiles: [ "legacy-development" ]
    image: postgres:17
    environment:
      POSTGRES_USER: ${PROBLEM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PROBLEM_POSTGRES_PASSWORD:-ojos-problem-local}
      POSTGRES_DB: ${PROBLEM_POSTGRES_DB:-ojos_problem}
    volumes:
      - problem-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  judge-db:
    profiles: [ "legacy-development" ]
    image: postgres:17
    environment:
      POSTGRES_USER: ${JUDGE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${JUDGE_POSTGRES_PASSWORD:-ojos-judge-local}
      POSTGRES_DB: ${JUDGE_POSTGRES_DB:-ojos_judge}
    volumes:
      - judge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  user-db:
    profiles: [ "legacy-development" ]
    image: postgres:17
    environment:
      POSTGRES_USER: ${USER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD:-ojos-user-local}
      POSTGRES_DB: ${USER_POSTGRES_DB:-ojos_user}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-DEV_ONLY_redis_password_not_for_production}" ]
    ports:
      - "127.0.0.1:6379:6379"
    networks: [ platform-control ]

  orchestrator-migrations:
    image: migrate/migrate:v4.18.3
    depends_on:
      orchestrator-db:
        condition: service_healthy
    volumes:
      - ../../services/orchestrator/migrations:/migrations:ro
      - type: bind
        source: ${ORCHESTRATOR_POSTGRES_CA_CERT:?set ORCHESTRATOR_POSTGRES_CA_CERT to an absolute host CA file}
        target: /run/secrets/orchestrator-postgres-ca.crt
        read_only: true
    # migrate/migrate uses lib/pq. Its URL therefore carries the fixed
    # container CA path, while the daemon receives the CA in its own option.
    command: [ "-path", "/migrations", "-database", "${ORCHESTRATOR_MIGRATION_DATABASE_URL:?set ORCHESTRATOR_MIGRATION_DATABASE_URL with sslmode=verify-full and sslrootcert=/run/secrets/orchestrator-postgres-ca.crt}", "up" ]
    networks: [ platform-control ]

  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/backend/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
    depends_on:
      orchestrator-migrations:
        condition: service_completed_successfully
    environment:
      OJOS_ENVIRONMENT: production
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:?set the production PostgreSQL URL with sslmode=require}
      ORCHESTRATOR_POSTGRES_CA_CERT: /run/secrets/orchestrator-postgres-ca.crt
      ORCHESTRATOR_ARTIFACT_DIR: /var/lib/ojos/orchestrator/artifacts
      ORCHESTRATOR_HEALTHCHECK_URL: ${ORCHESTRATOR_HEALTHCHECK_URL:-https://orchestrator:8090/api/v1/healthz/ready}
      ORCHESTRATOR_HEALTHCHECK_CA_CERT: /run/secrets/orchestrator-health-ca.crt
      ORCHESTRATOR_TLS_CERT: /run/secrets/orchestrator-tls.crt
      ORCHESTRATOR_TLS_KEY: /run/secrets/orchestrator-tls.key
      ORCHESTRATOR_NODE_CA_CERT: /run/secrets/orchestrator-node-ca.crt
      ORCHESTRATOR_NODE_CA_KEY: /run/secrets/orchestrator-node-ca.key
      ORCHESTRATOR_CATALOG_TRUST_KEYS: ${ORCHESTRATOR_CATALOG_TRUST_KEYS:-}
      ORCHESTRATOR_CATALOG_SOURCES: ${ORCHESTRATOR_CATALOG_SOURCES:-}
      ORCHESTRATOR_OIDC_ISSUER: ${ORCHESTRATOR_OIDC_ISSUER:-}
      ORCHESTRATOR_OIDC_AUDIENCE: ${ORCHESTRATOR_OIDC_AUDIENCE:-}
      ORCHESTRATOR_OIDC_CLIENT_ID: ${ORCHESTRATOR_OIDC_CLIENT_ID:-}
      ORCHESTRATOR_OIDC_SCOPES: ${ORCHESTRATOR_OIDC_SCOPES:-openid profile email}
      ORCHESTRATOR_PUBLIC_BASE_URL: ${ORCHESTRATOR_PUBLIC_BASE_URL:-}
      ORCHESTRATOR_OIDC_ROLE_CLAIM: ${ORCHESTRATOR_OIDC_ROLE_CLAIM:-roles}
      ORCHESTRATOR_OIDC_VIEWER_ROLE: ${ORCHESTRATOR_OIDC_VIEWER_ROLE:-viewer}
      ORCHESTRATOR_OIDC_OPERATOR_ROLE: ${ORCHESTRATOR_OIDC_OPERATOR_ROLE:-operator}
      ORCHESTRATOR_OIDC_ADMIN_ROLE: ${ORCHESTRATOR_OIDC_ADMIN_ROLE:-admin}
      ORCHESTRATOR_OIDC_JWKS_CACHE_SECONDS: ${ORCHESTRATOR_OIDC_JWKS_CACHE_SECONDS:-300}
      ORCHESTRATOR_OIDC_HTTP_TIMEOUT_SECONDS: ${ORCHESTRATOR_OIDC_HTTP_TIMEOUT_SECONDS:-5}
      # The only permitted plaintext provider path is this isolated Compose
      # bootstrap network. External/capacity deployments use HTTPS origins.
      ORCHESTRATOR_ALLOW_COMPOSE_BOOTSTRAP_HTTP: "1"
      ORCHESTRATOR_GATEWAY_ADMIN_ORIGIN: http://gateway:8080
      ORCHESTRATOR_GATEWAY_ADMIN_TOKEN: ${ORCHESTRATOR_GATEWAY_ADMIN_TOKEN:?set the dedicated Gateway topology management token}
      ORCHESTRATOR_AUTH_ADMIN_ORIGIN: http://auth-service:8081
      ORCHESTRATOR_AUTH_ADMIN_TOKEN: ${ORCHESTRATOR_AUTH_ADMIN_TOKEN:?set the dedicated Auth topology management token}
      ORCHESTRATOR_FRONTEND_ARTIFACT_CA_CERT: ${ORCHESTRATOR_FRONTEND_ARTIFACT_CA_CERT:-}
      ORCHESTRATOR_FRONTEND_ARTIFACT_TIMEOUT_MS: ${ORCHESTRATOR_FRONTEND_ARTIFACT_TIMEOUT_MS:-5000}
      ORCHESTRATOR_AUTH_PERMISSION_TIMEOUT_MS: ${ORCHESTRATOR_AUTH_PERMISSION_TIMEOUT_MS:-3000}
      # Dedicated workload-identity path. This credential can only mint
      # deployment JWTs; it is not the Auth admin or Orchestrator API token.
      ORCHESTRATOR_AUTH_WORKLOAD_ORIGIN: http://auth-service:8081
      ORCHESTRATOR_AUTH_WORKLOAD_TOKEN: ${ORCHESTRATOR_AUTH_WORKLOAD_TOKEN:?set a dedicated Auth workload issuer token}
      ORCHESTRATOR_GATEWAY_WORKLOAD_ORIGIN: ${ORCHESTRATOR_GATEWAY_WORKLOAD_ORIGIN:?set the B-node reachable HTTPS Gateway origin}
      ORCHESTRATOR_GATEWAY_WORKLOAD_CA_FILE: /run/secrets/gateway-workload-ca.crt
      # Public verifier material projected by the Store into every signed v3
      # workload API provider. The Auth signing key is never mounted here.
      ORCHESTRATOR_WORKLOAD_PUBLIC_KEY_FILE: /run/secrets/ojos-workload-public-key.pem
      ORCHESTRATOR_WORKLOAD_KEY_ID: ${OJOS_WORKLOAD_KEY_ID:?set OJOS_WORKLOAD_KEY_ID}
      ORCHESTRATOR_WORKLOAD_ISSUER: ${OJOS_WORKLOAD_ISSUER:?set OJOS_WORKLOAD_ISSUER}
      ORCHESTRATOR_WORKLOAD_AUDIENCE: ${OJOS_WORKLOAD_AUDIENCE:?set OJOS_WORKLOAD_AUDIENCE}
      ORCHESTRATOR_MAX_WORKERS: ${ORCHESTRATOR_MAX_WORKERS:-160}
      ORCHESTRATOR_LOG_RETENTION_DAYS: ${ORCHESTRATOR_LOG_RETENTION_DAYS:-30}
      ORCHESTRATOR_ARTIFACT_RETENTION_DAYS: ${ORCHESTRATOR_ARTIFACT_RETENTION_DAYS:-30}
      ORCHESTRATOR_ARTIFACT_QUOTA_BYTES: ${ORCHESTRATOR_ARTIFACT_QUOTA_BYTES:-10737418240}
      ORCHESTRATOR_OTEL_EXPORTER_OTLP_ENDPOINT: ${ORCHESTRATOR_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ORCHESTRATOR_OTEL_EXPORT_TIMEOUT_MS: ${ORCHESTRATOR_OTEL_EXPORT_TIMEOUT_MS:-2000}
      ORCHESTRATOR_OTEL_QUEUE_CAPACITY: ${ORCHESTRATOR_OTEL_QUEUE_CAPACITY:-1024}
      ORCHESTRATOR_LEGACY_API_MODE: gone
      OJOS_GITHUB_TOKEN: ${OJOS_GITHUB_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Compatibility-only internal callers still need an explicit distinct
      # credential. Public v1 Web/TUI traffic is authenticated through OIDC.
      ORCHESTRATOR_INTERNAL_TOKEN: ${ORCHESTRATOR_INTERNAL_TOKEN:?set ORCHESTRATOR_INTERNAL_TOKEN}
      # Target-bound observer verifiers. The control plane never receives the
      # raw credentials held by Gateway and Auth.
      ORCHESTRATOR_CONTRIBUTION_GATEWAY_ACK_TOKEN_SHA256: ${ORCHESTRATOR_CONTRIBUTION_GATEWAY_ACK_TOKEN_SHA256:?set the Gateway Contribution ACK token verifier}
      ORCHESTRATOR_CONTRIBUTION_AUTH_ACK_TOKEN_SHA256: ${ORCHESTRATOR_CONTRIBUTION_AUTH_ACK_TOKEN_SHA256:?set the Auth Contribution ACK token verifier}
      ORCHESTRATOR_OBSERVABILITY_TOKEN_FILE: /run/secrets/orchestrator-observability-token
      ORCHESTRATOR_GATEWAY_OBSERVABILITY_ORIGIN: ${ORCHESTRATOR_GATEWAY_OBSERVABILITY_ORIGIN:?set the external HTTPS Gateway observability origin}
      ORCHESTRATOR_REQUIRE_RELEASE_CHECKSUM: ${ORCHESTRATOR_REQUIRE_RELEASE_CHECKSUM:-1}
    ports:
      - "127.0.0.1:8090:8090"
    expose:
      - "8090"
    volumes:
      - orchestrator-artifacts:/var/lib/ojos/orchestrator/artifacts
      - type: bind
        source: ${ORCHESTRATOR_POSTGRES_CA_CERT:?set ORCHESTRATOR_POSTGRES_CA_CERT to an absolute host CA file}
        target: /run/secrets/orchestrator-postgres-ca.crt
        read_only: true
      - type: bind
        source: ${ORCHESTRATOR_HEALTHCHECK_CA_CERT:?set ORCHESTRATOR_HEALTHCHECK_CA_CERT to an absolute host CA file}
        target: /run/secrets/orchestrator-health-ca.crt
        read_only: true
      - type: bind
        source: ${ORCHESTRATOR_TLS_CERT:?set ORCHESTRATOR_TLS_CERT to an absolute host certificate file}
        target: /run/secrets/orchestrator-tls.crt
        read_only: true
      - type: bind
        source: ${ORCHESTRATOR_TLS_KEY:?set ORCHESTRATOR_TLS_KEY to an absolute host key file}
        target: /run/secrets/orchestrator-tls.key
        read_only: true
      - type: bind
        source: ${ORCHESTRATOR_NODE_CA_CERT:?set ORCHESTRATOR_NODE_CA_CERT to an absolute host CA file}
        target: /run/secrets/orchestrator-node-ca.crt
        read_only: true
      - type: bind
        source: ${ORCHESTRATOR_NODE_CA_KEY:?set ORCHESTRATOR_NODE_CA_KEY to an absolute host key file}
        target: /run/secrets/orchestrator-node-ca.key
        read_only: true
      - type: bind
        source: ${ORCHESTRATOR_GATEWAY_WORKLOAD_CA_CERT:?set ORCHESTRATOR_GATEWAY_WORKLOAD_CA_CERT to the Gateway CA bundle}
        target: /run/secrets/gateway-workload-ca.crt
        read_only: true
      - type: bind
        source: ${OJOS_WORKLOAD_PUBLIC_KEY_FILE:?set OJOS_WORKLOAD_PUBLIC_KEY_FILE to the Ed25519 public PEM}
        target: /run/secrets/ojos-workload-public-key.pem
        read_only: true
      - type: bind
        source: ${ORCHESTRATOR_OBSERVABILITY_TOKEN_FILE:?set ORCHESTRATOR_OBSERVABILITY_TOKEN_FILE to the dedicated token file}
        target: /run/secrets/orchestrator-observability-token
        read_only: true
    # v1 live/ready routes are auth-exempt. Production overrides the URL with HTTPS.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          case "$${ORCHESTRATOR_HEALTHCHECK_URL}" in
            https://*) curl -fsS --cacert "$${ORCHESTRATOR_HEALTHCHECK_CA_CERT}" "$${ORCHESTRATOR_HEALTHCHECK_URL}" ;;
            http://127.0.0.1:*|http://localhost:*) curl -fsS "$${ORCHESTRATOR_HEALTHCHECK_URL}" ;;
            *) echo "healthcheck URL must use HTTPS or loopback HTTP" >&2; exit 1 ;;
          esac
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [ platform-control, platform-egress ]

  auth-service-migrations:
    image: migrate/migrate:v4.18.3
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ../../services/auth-service/migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${AUTH_DATABASE_URL:?set the platform Auth PostgreSQL URL}", "up" ]
    networks: [ platform-control ]

  problem-service-migrations:
    profiles: [ "legacy-development" ]
    image: migrate/migrate:v4.18.3
    depends_on:
      problem-db:
        condition: service_healthy
    volumes:
      - ../../services/problem-service/migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${PROBLEM_DATABASE_URL:-postgres://postgres:ojos-problem-local@problem-db:5432/ojos_problem?sslmode=disable}", "up" ]

  judge-api-migrations:
    profiles: [ "legacy-development" ]
    image: migrate/migrate:v4.18.3
    depends_on:
      judge-db:
        condition: service_healthy
    volumes:
      - ../../services/judge-api/migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${JUDGE_DATABASE_URL:-postgres://postgres:ojos-judge-local@judge-db:5432/ojos_judge?sslmode=disable}", "up" ]

  user-service-migrations:
    profiles: [ "legacy-development" ]
    image: migrate/migrate:v4.18.3
    depends_on:
      user-db:
        condition: service_healthy
    volumes:
      - ../../services/user-service/migrations:/migrations:ro
    command: [ "-path", "/migrations", "-database", "${USER_DATABASE_URL:-postgres://postgres:ojos-user-local@user-db:5432/ojos_user?sslmode=disable}", "up" ]

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:14268:14268"
    networks: [ platform-control ]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ojos-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ojos-minio-local}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: [ "/bin/sh", "/opt/ojos/minio-init.sh" ]
    environment:
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ojos-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ojos-minio-local}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ojos-storage}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ojos-storage-local}
      OJOS_STORAGE_BUCKETS: problems,submissions,judge-artifacts,avatars
      OJOS_MINIO_LIFECYCLE_BUCKETS: ${OJOS_MINIO_LIFECYCLE_BUCKETS:-judge-artifacts,submissions}
      OJOS_MINIO_LIFECYCLE_EXPIRE_DAYS: ${OJOS_MINIO_LIFECYCLE_EXPIRE_DAYS:-30}
    volumes:
      - ./minio-init.sh:/opt/ojos/minio-init.sh:ro
    restart: "no"

  gateway:
    # Reserved platform bootstrap consumer. Business routes are compiled only
    # from active Contribution revisions; bootstrap code retains one Auth route.
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      auth-service:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    environment:
      OJOS_ENVIRONMENT: production
      OJOS_PLATFORM_BOOTSTRAP: "1"
      REDIS_URL: ${REDIS_URL:?set the platform Redis URL}
      JWT_SECRET: ${JWT_SECRET:?set the platform JWT secret}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      AUTH_SERVICE_ENDPOINT: http://auth-service:8081
      ORCHESTRATOR_PLATFORM_ORIGIN: https://orchestrator:8090
      ORCHESTRATOR_INTERNAL_TOKEN: ${ORCHESTRATOR_INTERNAL_TOKEN:?set the Orchestrator projection token}
      ORCHESTRATOR_GATEWAY_ADMIN_TOKEN: ${ORCHESTRATOR_GATEWAY_ADMIN_TOKEN:?set the dedicated Gateway topology management token}
      ORCHESTRATOR_CONTRIBUTION_GATEWAY_ACK_TOKEN: ${ORCHESTRATOR_CONTRIBUTION_GATEWAY_ACK_TOKEN:?set a dedicated Gateway Contribution ACK token}
      ORCHESTRATOR_NODE_ID: ${ORCHESTRATOR_NODE_ID:-child-node}
      SSL_CERT_FILE: /run/secrets/orchestrator-ca.crt
      OJOS_WORKLOAD_PUBLIC_KEY_FILE: /run/secrets/ojos-workload-public-key.pem
      OJOS_WORKLOAD_KEY_ID: ${OJOS_WORKLOAD_KEY_ID:?set OJOS_WORKLOAD_KEY_ID}
      OJOS_WORKLOAD_ISSUER: ${OJOS_WORKLOAD_ISSUER:?set OJOS_WORKLOAD_ISSUER}
      OJOS_WORKLOAD_AUDIENCE: ${OJOS_WORKLOAD_AUDIENCE:?set OJOS_WORKLOAD_AUDIENCE}
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ${OJOS_WORKLOAD_PUBLIC_KEY_FILE:?set OJOS_WORKLOAD_PUBLIC_KEY_FILE to the Ed25519 public PEM}
        target: /run/secrets/ojos-workload-public-key.pem
        read_only: true
      - type: bind
        source: ${ORCHESTRATOR_HEALTHCHECK_CA_CERT:?set ORCHESTRATOR_HEALTHCHECK_CA_CERT to the Orchestrator CA bundle}
        target: /run/secrets/orchestrator-ca.crt
        read_only: true
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    networks: [ platform-control ]

  auth-service:
    user: "65532:65532"
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      auth-service-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    expose:
      - "8081"
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      OJOS_ENVIRONMENT: production
      OJOS_PLATFORM_BOOTSTRAP: "1"
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?set the platform Auth PostgreSQL URL}
      JWT_SECRET: ${JWT_SECRET:?set the platform JWT secret}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:?set the Auth management token}
      # One-time initial-admin enrollment is enabled only while this dedicated
      # host file is mounted. Remove both this env entry and its bind mount,
      # then recreate Auth immediately after the administrator is created.
      AUTH_ADMIN_BOOTSTRAP_SECRET_FILE: /run/secrets/ojos-auth-admin-bootstrap
      ORCHESTRATOR_AUTH_ADMIN_TOKEN: ${ORCHESTRATOR_AUTH_ADMIN_TOKEN:?set the dedicated Auth topology management token}
      ORCHESTRATOR_PLATFORM_ORIGIN: https://orchestrator:8090
      ORCHESTRATOR_INTERNAL_TOKEN: ${ORCHESTRATOR_INTERNAL_TOKEN:?set ORCHESTRATOR_INTERNAL_TOKEN}
      ORCHESTRATOR_CONTRIBUTION_AUTH_ACK_TOKEN: ${ORCHESTRATOR_CONTRIBUTION_AUTH_ACK_TOKEN:?set a dedicated Auth Contribution ACK token}
      OJOS_WORKLOAD_PRIVATE_KEY_FILE: /run/secrets/ojos-workload-private-key.pem
      ORCHESTRATOR_AUTH_WORKLOAD_TOKEN: ${ORCHESTRATOR_AUTH_WORKLOAD_TOKEN:?set a dedicated Auth workload issuer token}
      OJOS_WORKLOAD_KEY_ID: ${OJOS_WORKLOAD_KEY_ID:?set OJOS_WORKLOAD_KEY_ID}
      OJOS_WORKLOAD_ISSUER: ${OJOS_WORKLOAD_ISSUER:?set OJOS_WORKLOAD_ISSUER}
      OJOS_WORKLOAD_AUDIENCE: ${OJOS_WORKLOAD_AUDIENCE:?set OJOS_WORKLOAD_AUDIENCE}
      SSL_CERT_FILE: /run/secrets/orchestrator-ca.crt
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
    volumes:
      - type: bind
        source: ${AUTH_ADMIN_BOOTSTRAP_SECRET_FILE:?set AUTH_ADMIN_BOOTSTRAP_SECRET_FILE to the private one-time host token file}
        target: /run/secrets/ojos-auth-admin-bootstrap
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OJOS_WORKLOAD_PRIVATE_KEY_FILE:?set OJOS_WORKLOAD_PRIVATE_KEY_FILE to the Ed25519 private PEM}
        target: /run/secrets/ojos-workload-private-key.pem
        read_only: true
      - type: bind
        source: ${ORCHESTRATOR_HEALTHCHECK_CA_CERT:?set ORCHESTRATOR_HEALTHCHECK_CA_CERT to the Orchestrator CA bundle}
        target: /run/secrets/orchestrator-ca.crt
        read_only: true
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    networks: [ platform-control ]

  user-service:
    profiles: [ "legacy-development" ]
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      user-service-migrations:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      storage-service:
        condition: service_started
    expose:
      - "8084"
    environment:
      OJOS_ENVIRONMENT: development
      DATABASE_URL: ${USER_DATABASE_URL:-postgres://postgres:ojos-user-local@user-db:5432/ojos_user?sslmode=disable}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8081}
      AUTH_SERVICE_ADMIN_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      OJOS_AUTH_PERMISSION_GATEWAY_ENDPOINT: ${OJOS_AUTH_PERMISSION_GATEWAY_ENDPOINT:-}
      OJOS_AUTH_PERMISSION_CHECK_API_ID: ${OJOS_AUTH_PERMISSION_CHECK_API_ID:-auth.user.permission.check}
      OJOS_USER_SERVICE_TOKEN: ${OJOS_USER_SERVICE_TOKEN:-}
      OJOS_CALLER_NODE_ID: ${OJOS_CALLER_NODE_ID:-child-node}

  storage-service:
    profiles: [ "legacy-development" ]
    build:
      context: ../..
      dockerfile: services/storage-service/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    expose:
      - "8085"
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      OJOS_ENVIRONMENT: development
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      OJOS_STORAGE_ROOT: /data/ojos/storage
      OJOS_STORAGE_BUCKETS: problems,submissions,judge-artifacts,avatars
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ojos-storage}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ojos-storage-local}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
    volumes:
      - storage-service-data:/data/ojos/storage

  judge-api:
    profiles: [ "legacy-development" ]
    build:
      context: ../..
      dockerfile: services/judge-api/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      judge-api-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    expose:
      - "8082"
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      OJOS_ENVIRONMENT: development
      DATABASE_URL: ${JUDGE_DATABASE_URL:-postgres://postgres:ojos-judge-local@judge-db:5432/ojos_judge?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://:DEV_ONLY_redis_password_not_for_production@redis:6379/0}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8081}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      OJOS_AUTH_PERMISSION_GATEWAY_ENDPOINT: ${OJOS_AUTH_PERMISSION_GATEWAY_ENDPOINT:-}
      OJOS_AUTH_PERMISSION_CHECK_API_ID: ${OJOS_AUTH_PERMISSION_CHECK_API_ID:-auth.user.permission.check}
      OJOS_JUDGE_API_SERVICE_TOKEN: ${OJOS_JUDGE_API_SERVICE_TOKEN:-ojos-local-internal}
      OJOS_WORKER_TOKEN: ""
      OJOS_WORKLOAD_PUBLIC_KEY_FILE: /run/secrets/ojos-workload-public-key.pem
      OJOS_WORKLOAD_KEY_ID: ${OJOS_WORKLOAD_KEY_ID:-workload-1}
      OJOS_WORKLOAD_ISSUER: ${OJOS_WORKLOAD_ISSUER:-ojos-auth/workload}
      OJOS_WORKLOAD_AUDIENCE: ${OJOS_WORKLOAD_AUDIENCE:-ojos-gateway}
      OJOS_ALLOW_LEGACY_WORKER_TOKEN: "false"
      OJOS_INTERNAL_GATEWAY_ENDPOINT: http://gateway:8080
      OJOS_STORAGE_OBJECT_GET_API_ID: storage.object.get
      OJOS_STORAGE_OBJECT_PUT_API_ID: storage.object.put
      OJOS_STORAGE_OBJECT_HEAD_API_ID: storage.object.head
      OJOS_SERVICE_TOKEN: ${OJOS_JUDGE_API_SERVICE_TOKEN:-ojos-local-internal}
      OJOS_CALLER_SERVICE: judge-api
      OJOS_CALLER_NODE_ID: ${OJOS_CALLER_NODE_ID:-child-node}
      OJOS_PROBLEM_EVENT_STREAM: ${OJOS_PROBLEM_EVENT_STREAM:-ojos:integration:problem:v1}
    volumes:
      - type: bind
        source: ${OJOS_WORKLOAD_PUBLIC_KEY_FILE:?set OJOS_WORKLOAD_PUBLIC_KEY_FILE to the Ed25519 public PEM}
        target: /run/secrets/ojos-workload-public-key.pem
        read_only: true

  judge-worker:
    # Compatibility only: production B nodes run an enrolled Agent and install
    # the signed v2 release. This profile must be selected explicitly for old
    # single-host development (`--profile legacy-development`).
    profiles: [ "legacy-development" ]
    build:
      context: ../..
      dockerfile: services/judge-worker/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
    depends_on:
      judge-api:
        condition: service_started
      problem-service:
        condition: service_started
      redis:
        condition: service_started
      storage-service:
        condition: service_started
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_CHROOT
    privileged: true
    cgroup: host
    security_opt:
      - apparmor=unconfined
    environment:
      OJOS_ENVIRONMENT: development
      LANGUAGES_CONFIG: config/languages.yaml
      OJOS_JUDGE_API_URL: http://judge-api:8082
      OJOS_INTERNAL_GATEWAY_URL: http://gateway:8080
      OJOS_STORAGE_OBJECT_GET_API_ID: storage.object.get
      OJOS_STORAGE_OBJECT_PUT_API_ID: storage.object.put
      OJOS_REDIS_URL: ${REDIS_URL:-redis://:DEV_ONLY_redis_password_not_for_production@redis:6379/0}
      OJOS_JUDGE_TASK_STREAM: ojos:judge:task
      OJOS_JUDGE_CONSUMER_GROUP: judge-worker
      OJOS_RUNNER_MODE: ${OJOS_RUNNER_MODE:-nsjail}
      OJOS_WORKER_TOKEN: ${OJOS_WORKER_TOKEN:-ojos-local-worker}
      OJOS_JUDGE_WORKER_SERVICE_TOKEN: ${OJOS_JUDGE_WORKER_SERVICE_TOKEN:-ojos-local-internal}
      OJOS_SERVICE_TOKEN: ${OJOS_JUDGE_WORKER_SERVICE_TOKEN:-ojos-local-internal}
      OJOS_CALLER_NODE_ID: ${OJOS_CALLER_NODE_ID:-child-node}
      OJOS_MAX_CONCURRENCY: 1
      OJOS_WORK_DIR: /var/lib/ojos-worker/work
      OJOS_ARTIFACT_CACHE_DIR: /var/lib/ojos-worker/cache
      OJOS_SUPPORTED_LANGUAGES: cpp17,c11,python3,java17
      OJOS_HEARTBEAT_INTERVAL: 10
      OJOS_TASK_LEASE_TTL: 60
      OJOS_ALLOW_CGROUP_FALLBACK: ${OJOS_ALLOW_CGROUP_FALLBACK:-false}
      OJOS_NSJAIL_NO_PIVOTROOT: ${OJOS_NSJAIL_NO_PIVOTROOT:-false}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      RUST_LOG: info
    volumes:
      - worker-data:/var/lib/ojos-worker
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  problem-service:
    profiles: [ "legacy-development" ]
    build:
      context: ../..
      dockerfile: services/problem-service/Dockerfile
      args:
        HTTP_PROXY: ${OJOS_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${OJOS_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${OJOS_BUILD_NO_PROXY:-}
        http_proxy: ${OJOS_BUILD_HTTP_PROXY:-}
        https_proxy: ${OJOS_BUILD_HTTPS_PROXY:-}
        no_proxy: ${OJOS_BUILD_NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      problem-service-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      storage-service:
        condition: service_started
      jaeger:
        condition: service_started
    expose:
      - "8083"
    environment:
      OJOS_ENVIRONMENT: development
      DATABASE_URL: ${PROBLEM_DATABASE_URL:-postgres://postgres:ojos-problem-local@problem-db:5432/ojos_problem?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://:DEV_ONLY_redis_password_not_for_production@redis:6379/0}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      AUTH_SERVICE_ENDPOINT: ${AUTH_SERVICE_ENDPOINT:-http://auth-service:8081}
      AUTH_SERVICE_ADMIN_TOKEN: ${AUTH_INTERNAL_TOKEN:-ojos-local-internal}
      OJOS_AUTH_PERMISSION_GATEWAY_ENDPOINT: ${OJOS_AUTH_PERMISSION_GATEWAY_ENDPOINT:-}
      OJOS_AUTH_PERMISSION_CHECK_API_ID: ${OJOS_AUTH_PERMISSION_CHECK_API_ID:-auth.user.permission.check}
      OJOS_PROBLEM_SERVICE_TOKEN: ${OJOS_PROBLEM_SERVICE_TOKEN:-ojos-local-internal}
      OJOS_PROBLEMS_ROOT: /data/ojos/problems
      OJOS_STORAGE_SERVICE_URL: http://storage-service:8085
      OJOS_INTERNAL_GATEWAY_URL: http://gateway:8080
      OJOS_STORAGE_OBJECT_PUT_API_ID: storage.object.put
      OJOS_PROBLEM_STORAGE_BUCKET: problems
      OJOS_SERVICE_TOKEN: ${OJOS_PROBLEM_SERVICE_TOKEN:-ojos-local-internal}
      OJOS_CALLER_SERVICE: problem-service
      OJOS_CALLER_NODE_ID: ${OJOS_CALLER_NODE_ID:-child-node}
      OJOS_PROBLEM_EVENT_STREAM: ${OJOS_PROBLEM_EVENT_STREAM:-ojos:integration:problem:v1}
      OJOS_PROBLEM_EVENT_REPLAY_ON_START: ${OJOS_PROBLEM_EVENT_REPLAY_ON_START:-false}
    volumes:
      - ../../storage/problems:/data/ojos/problems

volumes:
  orchestrator-db-data:
  orchestrator-artifacts:
  auth-db-data:
  problem-db-data:
  judge-db-data:
  user-db-data:
  minio-data:
  storage-service-data:
  worker-data:

networks:
  default:
  platform-control:
    internal: true
  platform-egress:
