services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ojos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: [ "redis-server", "--appendonly", "yes" ]

  migrations:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ojos}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ../migrations:/migrations:ro
      - ./apply-migrations.sh:/apply-migrations.sh:ro
    entrypoint: [ "/bin/sh", "/apply-migrations.sh" ]

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:14268:14268"

  gateway:
    build:
      context: ../../services
      dockerfile: gateway/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      migrations:
        condition: service_completed_successfully
      module-installer:
        condition: service_started
      problem-api:
        condition: service_started
    environment:
      DATABASE_URL: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MODULE_INSTALLER_ENDPOINT: ${MODULE_INSTALLER_ENDPOINT:-http://module-installer:8090}
      MODULE_INSTALLER_INTERNAL_TOKEN: ${MODULE_INSTALLER_INTERNAL_TOKEN:?MODULE_INSTALLER_INTERNAL_TOKEN is required}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      OJOS_PROBLEMS_ROOT: /data/ojos/problems
      OJOS_SUBMISSIONS_ROOT: /data/ojos/submissions
    ports:
      - "8080:8080"
    volumes:
      - ../../storage/problems:/data/ojos/problems:ro
      - ../../storage/submissions:/data/ojos/submissions:ro

  module-installer:
    build:
      context: ../..
      dockerfile: services/module-installer/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    depends_on:
      migrations:
        condition: service_completed_successfully
    expose:
      - "8090"
    environment:
      DATABASE_URL: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      MODULE_INSTALLER_INTERNAL_TOKEN: ${MODULE_INSTALLER_INTERNAL_TOKEN:?MODULE_INSTALLER_INTERNAL_TOKEN is required}
      MODULE_INSTALLER_HOST: 0.0.0.0
      MODULE_INSTALLER_PORT: 8090
      OJOS_REPO_ROOT: /workspace
      RUST_LOG: info
    volumes:
      - ../../modules:/workspace/modules:ro
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8090/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  auth:
    build:
      context: ../../services
      dockerfile: auth/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    expose:
      - "8081"
    environment:
      DATABASE_URL: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}

  judge-api:
    build:
      context: ../../services
      dockerfile: judge-api/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    expose:
      - "8082"
    environment:
      DATABASE_URL: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      OJOS_SUBMISSIONS_ROOT: /data/ojos/submissions
      OJOS_WORKER_TOKEN: ${OJOS_WORKER_TOKEN:?OJOS_WORKER_TOKEN is required}
    volumes:
      - ../../storage/submissions:/data/ojos/submissions
      - ../../storage/problems:/data/ojos/problems:ro

  judge-worker:
    build:
      context: ../../services
      dockerfile: judge-worker/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    depends_on:
      gateway:
        condition: service_started
    environment:
      LANGUAGES_CONFIG: config/languages.yaml
      OJOS_CONTROL_PLANE_URL: http://gateway:8080/api
      OJOS_WORKER_TOKEN: ${OJOS_WORKER_TOKEN:?OJOS_WORKER_TOKEN is required}
      OJOS_MAX_CONCURRENCY: 1
      OJOS_WORK_DIR: /var/lib/ojos-worker/work
      OJOS_ARTIFACT_CACHE_DIR: /var/lib/ojos-worker/cache
      OJOS_SUPPORTED_LANGUAGES: cpp17,c11,python3,java17
      OJOS_HEARTBEAT_INTERVAL: 10
      OJOS_TASK_LEASE_TTL: 60
      OJOS_CGROUP_V2_ROOT: /sys/fs/cgroup
      OJOS_ALLOW_CGROUP_FALLBACK: ${OJOS_ALLOW_CGROUP_FALLBACK:-false}
      OJOS_NSJAIL_NO_PIVOTROOT: ${OJOS_NSJAIL_NO_PIVOTROOT:-false}
      RUST_LOG: info
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - NET_ADMIN
    cgroup: host
    volumes:
      - worker-data:/var/lib/ojos-worker
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  problem-api:
    build:
      context: ../../services
      dockerfile: problem-api/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    expose:
      - "8083"
    environment:
      DATABASE_URL: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
      OJOS_PROBLEMS_ROOT: /data/ojos/problems
    volumes:
      - ../../storage/problems:/data/ojos/problems

volumes:
  postgres-data:
  worker-data:
