schema_version: 2
service_name: judge-api
version: 0.1.1
description: Cross-machine registration contract for the actual A-side Judge API.
service_type: backend-api
source:
  kind: local
  url: local://deploy/cross-machine/judge-api-provider
  checksum: ""
runtime:
  kind: image
  image: ""
  binary: ""
  system_service: ""
frontend:
  enabled: false
  route_prefix: ""
  remote_entry: ""
  menu_items: []
backend:
  protocol: http
  port: 8082
  health_path: /health
migrations: []
permissions:
  - judge.worker
routes: []
provides:
  apis:
    - id: judge.worker.control
      version: 1.0.0
      protocol: http
      path: /api/judge/worker
      methods: [GET, POST]
      visibility: explicit
      auth: workload
      permission: judge.worker
      stability: stable
      timeout_ms: 35000
requires:
  apis: []
events:
  publishes: []
  subscribes:
    - type: io.ojos.problem.snapshot.v1
      version: 1.0.0
      consumer_group: judge-api
    - type: io.ojos.problem.deleted.v1
      version: 1.0.0
      consumer_group: judge-api
runtime_contract:
  id: standard-container-v1
  sha256: sha256:56c8ec1e421205dbebb97ad40cbda30bf468d198dd8c3fc50151e39465ea573f
  binding_directory: /run/ojos/service
  identity_mode: workload
  credential_delivery: file
  restart_on_change: false
redis: []
storage: []
dependencies: []
config_schema: {}
secrets: []
observability:
  metrics: true
  jaeger: true
