services:
  postgres:
    image: postgres:17
    container_name: ojos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ojos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: ojos-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:latest
    container_name: ojos-nats
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  postgres-data: