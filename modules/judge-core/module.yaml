schema_version: 1
id: ojos.judge-core
name: Judge Core
version: 0.1.0
set: core-capability
kind: feature
status: builtin
description: Problem catalog, package validation, submissions, judging, Worker Link, result storage, and judge cluster administration.

compatibility:
  platform: ">=0.1.0"
  installer: ">=0.1.0"

requires:
  modules:
    - id: ojos.platform.web-shell
      version: ">=0.1.0"
    - id: ojos.platform.identity-access
      version: ">=0.1.0"
    - id: ojos.platform.storage
      version: ">=0.1.0"
    - id: ojos.platform.gateway
      version: ">=0.1.0"
    - id: ojos.kernel.module-runtime
      version: ">=0.1.0"
    - id: ojos.kernel.audit
      version: ">=0.1.0"
    - id: ojos.kernel.health
      version: ">=0.1.0"

provides:
  permissions:
    - key: problem.view
      description: View public problems.
    - key: problem.view.private
      description: View private problems.
    - key: problem.create
      description: Create problems.
    - key: problem.edit
      description: Edit problems.
    - key: problem.delete
      description: Delete problems.
    - key: problem.manage.data
      description: Manage problem test data.
    - key: problem.manage.asset
      description: Manage problem assets.
    - key: judge.submit
      description: Submit code to judge.
    - key: submission.view.own
      description: View own submissions.
    - key: submission.view.all
      description: View all submissions.

  roles: []

  components:
    - id: problem-api
      type: backend_service
      status: ENABLED
      config:
        service: problem-api
        health: /health
        exposure: internal
    - id: judge-api
      type: backend_service
      status: ENABLED
      config:
        service: judge-api
        health: /health
        exposure: internal
    - id: judge-worker
      type: worker_service
      status: ENABLED
      config:
        mode: external-node
    - id: problems-storage
      type: storage_bucket
      status: ENABLED
      config:
        bucket: problems
    - id: submissions-storage
      type: storage_bucket
      status: ENABLED
      config:
        bucket: submissions
    - id: judge-artifacts-storage
      type: storage_bucket
      status: ENABLED
      config:
        bucket: judge-artifacts

  services:
    - id: problem-api
      path: services/problem-api
      health: /health
      exposure: internal
    - id: judge-api
      path: services/judge-api
      health: /health
      exposure: internal

  workers:
    - id: judge-worker
      path: services/judge-worker
      mode: external-node

  frontend_routes:
    - path: /problems
      name: problems
      component_key: ProblemListView
      required_permission: problem.view
      enabled: true
    - path: /problems/new
      name: problem-create
      component_key: ProblemCreateView
      required_permission: problem.create
      enabled: true
    - path: /problems/:id
      name: problem-detail
      component_key: ProblemDetailView
      required_permission: problem.view
      enabled: true
    - path: /problems/:id/edit
      name: problem-edit
      component_key: ProblemEditView
      required_permission: problem.edit
      enabled: true
    - path: /problems/:id/package
      name: problem-package
      component_key: ProblemPackageView
      required_permission: problem.manage.data
      enabled: true
    - path: /problems/:id/submit
      name: problem-submit
      component_key: ProblemSubmitView
      required_permission: judge.submit
      enabled: true
    - path: /submissions
      name: submissions
      component_key: SubmissionsListView
      required_permission: submission.view.own
      enabled: true
    - path: /submissions/:id
      name: submission-detail
      component_key: SubmissionDetailView
      required_permission: submission.view.own
      enabled: true
    - path: /admin/judge
      name: admin-judge
      component_key: AdminJudgeView
      required_permission: system.admin
      enabled: true

  menus:
    - key: problems
      title: Problems
      route_path: /problems
      sort_order: 10
      enabled: true
    - key: submissions
      title: Submissions
      route_path: /submissions
      sort_order: 20
      enabled: true
    - key: admin-judge
      title: Judge Cluster
      route_path: /admin/judge
      sort_order: 100
      required_permission: system.admin
      enabled: true

  gateway_routes:
    - prefix: /api/problem
      target_service: problem-api
      auth_mode: required
      enabled: true
    - prefix: /api/judge
      target_service: judge-api
      auth_mode: required
      enabled: true

  storage:
    buckets:
      - problems
      - submissions
      - judge-artifacts

  storage_buckets:
    - id: problems
      description: Problem statements, package metadata, and problem assets.
    - id: submissions
      description: Submission source and result records.
    - id: judge-artifacts
      description: Judge runtime artifacts retained by controlled policy.

  health_checks:
    - id: problem-api-health
      type: http
      optional: false
    - id: judge-api-health
      type: http
      optional: false
    - id: worker-cluster-health
      type: metadata
      optional: false
    - id: queue-health
      type: metadata
      optional: false
    - id: artifact-storage-health
      type: metadata
      optional: false

  migrations:
    - up: deploy/migrations/000002_judge_schema.up.sql
      down: deploy/migrations/000002_judge_schema.down.sql
    - up: deploy/migrations/000004_problem_package_core.up.sql
      down: deploy/migrations/000004_problem_package_core.down.sql
    - up: deploy/migrations/000005_judge_sandbox_storage_cleanup.up.sql
      down: deploy/migrations/000005_judge_sandbox_storage_cleanup.down.sql
    - up: deploy/migrations/000007_problem_catalog_fields.up.sql
      down: deploy/migrations/000007_problem_catalog_fields.down.sql
    - up: deploy/migrations/000008_worker_link.up.sql
      down: deploy/migrations/000008_worker_link.down.sql

  events:
    publishes:
      - judge.submission.created
      - judge.submission.finished
    subscribes: []

  scheduled_jobs: []

  admin_panels:
    - id: judge-cluster
      route_path: /admin/judge
      required_permission: system.admin

  topology:
    nodes:
      - id: problem-api
        type: service
        label: Problem API
      - id: judge-api
        type: service
        label: Judge API
      - id: judge-worker
        type: worker
        label: Judge Worker
    edges:
      - from: gateway
        to: problem-api
        type: routes
      - from: gateway
        to: judge-api
        type: routes
      - from: judge-api
        to: judge-worker
        type: worker-link
