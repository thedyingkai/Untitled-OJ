schema_version: 1
id: ojos.demo-module
name: Demo Module
version: 0.1.0
set: demo
kind: feature
status: demo
description: Installer validation demo module without runtime business APIs.

compatibility:
  platform: ">=0.1.0"
  installer: ">=0.1.0"

requires:
  modules:
    - id: ojos.platform.web-shell
      version: ">=0.1.0"
    - id: ojos.platform.identity-access
      version: ">=0.1.0"
    - id: ojos.kernel.module-runtime
      version: ">=0.1.0"

provides:
  permissions:
    - key: demo.view
      description: View demo module metadata.

  roles: []

  components:
    - id: demo-component
      type: metadata
      status: DISABLED
      config:
        purpose: installer-acceptance

  services: []

  workers: []

  frontend_routes:
    - path: /admin/modules/demo
      name: demo-module
      component_key: demo-placeholder
      required_permission: demo.view
      enabled: false

  menus:
    - key: demo-module
      title: Demo Module
      route_path: /admin/modules/demo
      sort_order: 900
      required_permission: demo.view
      enabled: false

  gateway_routes: []

  storage:
    buckets: []

  storage_buckets: []

  health_checks:
    - id: demo-health
      type: metadata
      optional: true

  migrations: []

  events:
    publishes: []
    subscribes: []

  scheduled_jobs: []

  admin_panels:
    - id: demo-module
      route_path: /admin/modules/demo
      required_permission: demo.view

  topology:
    nodes:
      - id: demo-component
        type: metadata
        label: Demo Component
    edges: []
