schema_version: 1
id: ojos.demo-module
name: Demo Module
version: 0.1.0
set: demo
kind: feature
status: demo
description: Installer validation demo module without runtime business APIs.

compatibility:
  platform: ">=0.1.0"
  installer: ">=0.1.0"

requires:
  modules:
    - id: ojos.platform.web-shell
      version: ">=0.1.0"
    - id: ojos.platform.identity-access
      version: ">=0.1.0"
    - id: ojos.kernel.module-runtime
      version: ">=0.1.0"

provides:
  permissions:
    - key: demo.view
      description: View demo module metadata.

  roles: []

  components:
    - id: demo-component
      type: metadata
      status: DISABLED
      config:
        purpose: installer-acceptance

  services:
    - id: demo-metadata-service
      name: Demo Metadata Service
      kind: metadata
      lifecycle: metadata
      trusted_runtime: metadata
      health_check_id: demo-health
      routes: []
      required: false

  workers: []

  frontend_routes:
    - path: /admin/modules/demo
      name: demo-module
      component_key: demo-placeholder
      required_permission: demo.view
      enabled: false

  menus:
    - key: demo-module
      title: Demo Module
      route_path: /admin/modules/demo
      sort_order: 900
      required_permission: demo.view
      enabled: false

  gateway_routes:
    - prefix: /api/demo-module
      service_id: demo-api
      auth_mode: user
      enabled: false

  storage:
    buckets:
      - demo-metadata

  storage_buckets:
    - id: demo-metadata
      description: Metadata-only bucket declaration for installer/runtime wiring acceptance.

  health_checks:
    - id: demo-health
      type: metadata
      optional: true

  migrations: []

  events:
    publishes:
      - demo.module.enabled
    subscribes:
      - kernel.runtime.snapshot.generated

  scheduled_jobs: []

  admin_panels:
    - id: demo-module
      route_path: /admin/modules/demo
      required_permission: demo.view

  topology:
    nodes:
      - id: demo-component
        type: metadata
        label: Demo Component
      - id: demo-health
        type: health
        label: Demo Metadata Health
    edges:
      - from: demo-component
        to: demo-health
        type: observes
