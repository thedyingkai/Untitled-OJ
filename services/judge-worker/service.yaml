schema_version: 1
id: judge-worker
name: Judge Worker (legacy development descriptor)
version: 0.1.0
kind: backend-worker
description: >-
  Development-only compatibility descriptor for the manual Compose entry.
  Production installation must use release.yaml (Service Contract v2),
  named ApiBindings, Deployment JWTs, and the fixed judge-sandbox-v1 profile.
runtime:
  mode: container
  driver: compose
  root_allowed: true
  non_root_allowed: true
  start_policy: automatic
  restart_policy: on-failure
endpoint:
  protocol: http
  default_port: 9101
  health_path: /healthz/ready
  expose: false
  routes: []
requires:
  services:
    - judge-api
  links:
    - id: judge-api
      protocol: http
  storage: []
  database: []
  queue: []
  secrets:
    - worker-token
provides:
  capabilities:
    - judge.worker
  routes: []
  workers:
    - judge-worker
  storage_buckets: []
  events: []
config_schema:
  max_parallel_jobs:
    type: integer
    default: 16
  sandbox_slots:
    type: integer
    default: 16
  supported_languages:
    type: array
    default:
      - cpp17
      - c11
      - python3
      - java17
resources:
  cpu: dedicated
  memory: 2Gi
  disk: 8Gi
  gpu: optional
  network: internal
security:
  # The legacy descriptor cannot request privileged Docker settings. This is
  # intentional: Store production installs must use the closed runtime profile.
  allow_privileged: false
  allow_host_mount: false
  allow_arbitrary_command: false
  required_secrets:
    - worker-token
  sandbox:
    required: true
  network_policy:
    egress_links_only: true
source:
  type: local
  ref: services/judge-worker
  build:
    driver: dockerfile
    path: services/judge-worker/Dockerfile
  artifact: {}
ui:
  enabled: false
  routes: []
  menus: []
  permissions: []
permissions:
  - judge.worker
health:
  checks:
    - http
  timeout_seconds: 3
  interval_seconds: 10
