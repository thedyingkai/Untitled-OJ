schema_version: 1
service_name: storage-service
version: 0.1.0
description: Release contract for storage-service.
service_type: storage
source:
  kind: local
  url: local://services/storage-service
  checksum: ""
runtime:
  kind: local-process
  image: ""
  binary: ""
  system_service: ""
  command: go
  args: ["run", ".", "-f", "${OJOS_STORAGE_SERVICE_CONFIG}"]
  working_dir: services/storage-service
  env: {}
frontend:
  enabled: false
  route_prefix: ""
  remote_entry: ""
  menu_items: []
backend:
  protocol: http
  port: 8085
  health_path: /health
migrations: []
permissions:
  - storage.object.read
  - storage.object.write
  - storage.object.delete
routes: []
apis:
  - api_id: storage.object.put
    protocol: http
    port_name: http
    path_prefix: /api/storage/objects
    methods: [PUT, POST]
    visibility: descendants
    auth_mode: service
    permission: storage.object.write
    version: v1
    stability: stable
  - api_id: storage.object.get
    protocol: http
    port_name: http
    path_prefix: /api/storage/objects
    methods: [GET]
    visibility: descendants
    auth_mode: service
    permission: storage.object.read
    version: v1
    stability: stable
  - api_id: storage.object.head
    protocol: http
    port_name: http
    path_prefix: /api/storage/objects
    methods: [HEAD]
    visibility: descendants
    auth_mode: service
    permission: storage.object.read
    version: v1
    stability: stable
  - api_id: storage.object.delete
    protocol: http
    port_name: http
    path_prefix: /api/storage/objects
    methods: [DELETE]
    visibility: descendants
    auth_mode: service
    permission: storage.object.delete
    version: v1
    stability: stable
redis: []
storage:
  - object_type: problem-package
    bucket: problems
  - object_type: submission-code
    bucket: submissions
  - object_type: judge-artifact
    bucket: judge-artifacts
dependencies:
  - minio
config_schema: {}
secrets: []
observability:
  metrics: true
  jaeger: true

