schema_version: 2
service_name: storage-service
version: 0.1.0
description: Object storage provider for Service Contract v2 resource references.
service_type: storage
source:
  kind: local
  url: local://services/storage-service
  checksum: ""
runtime:
  kind: image
  image: ""
  binary: ""
  system_service: ""
frontend:
  enabled: false
  route_prefix: ""
  remote_entry: ""
  menu_items: []
backend:
  protocol: http
  port: 8085
  health_path: /health
migrations: []
permissions:
  - storage.object.read
  - storage.object.write
  - storage.object.delete
routes: []
provides:
  apis:
    - id: storage.object.put
      version: 1.0.0
      protocol: http
      path: /api/storage/objects
      methods: [PUT]
      visibility: explicit
      auth: workload
      permission: storage.object.write
      stability: stable
      timeout_ms: 300000
    - id: storage.object.get
      version: 1.0.0
      protocol: http
      path: /api/storage/objects
      methods: [GET]
      visibility: explicit
      auth: workload
      permission: storage.object.read
      stability: stable
      timeout_ms: 300000
    - id: storage.object.head
      version: 1.0.0
      protocol: http
      path: /api/storage/objects
      methods: [HEAD]
      visibility: explicit
      auth: workload
      permission: storage.object.read
      stability: stable
      timeout_ms: 300000
    - id: storage.object.delete
      version: 1.0.0
      protocol: http
      path: /api/storage/objects
      methods: [DELETE]
      visibility: explicit
      auth: workload
      permission: storage.object.delete
      stability: stable
      timeout_ms: 300000
requires:
  apis: []
events:
  publishes: []
  subscribes: []
runtime_contract:
  id: standard-container-v1
  sha256: sha256:56c8ec1e421205dbebb97ad40cbda30bf468d198dd8c3fc50151e39465ea573f
  binding_directory: /run/ojos/service
  identity_mode: workload
  credential_delivery: file
  restart_on_change: false
redis: []
storage:
  - object_type: problem-package
    bucket: problems
  - object_type: submission-code
    bucket: submissions
  - object_type: judge-artifact
    bucket: judge-artifacts
dependencies:
  - minio
config_schema:
  STORAGE_BACKEND:
    type: enum
    values: [local, minio]
    default: local
  MINIO_ENDPOINT:
    type: string
    default: minio:9000
  MINIO_ACCESS_KEY:
    type: secret
  MINIO_SECRET_KEY:
    type: secret
  MINIO_USE_SSL:
    type: boolean
    default: false
secrets: []
observability:
  metrics: true
  jaeger: true
