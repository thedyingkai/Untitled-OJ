Name: storage-service
Host: 0.0.0.0
Port: 8085
Timeout: 600000

# Object bodies must be streamed. The go-zero timeout middleware buffers the
# whole response, so network and caller deadlines provide the outer bound.
Middlewares:
  Timeout: false
  Recover: false

Storage:
  Backend: local
  Root: /data/ojos/storage
  Buckets:
    - problems
    - submissions
    - judge-artifacts
    - avatars
  MinIO:
    Endpoint: minio:9000
    AccessKey: ""
    SecretKey: ""
    UseSSL: false

Jaeger:
  Endpoint: ojos-jaeger:4317
