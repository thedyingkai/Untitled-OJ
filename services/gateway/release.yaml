schema_version: 1
service_name: gateway
version: 0.1.0
description: Release contract for gateway.
service_type: gateway
source:
  kind: local
  url: local://services/gateway
  checksum: ""
runtime:
  kind: image
  image: ""
  binary: ""
  system_service: ""
frontend:
  enabled: true
  route_prefix: "/"
  remote_entry: "/assets/gateway/remoteEntry.js"
  menu_items: []
backend:
  protocol: http
  port: 8080
  health_path: /health
migrations: []
permissions:
  - gateway.read
routes:
  - path: /api/**
    method: ANY
    target_type: endpoint-group
    target: gateway[*]
    permission: public
apis:
  - api_id: gateway.health
    protocol: http
    port_name: http
    path_prefix: /health
    methods: [GET]
    visibility: descendants
    auth_mode: public
    permission: public
    version: v1
    stability: stable
  - api_id: gateway.routes.reload
    protocol: http
    port_name: http
    path_prefix: /api/admin/orchestrator/routes/reload
    methods: [POST]
    visibility: same-node
    auth_mode: service
    permission: gateway.read
    version: v1
    stability: experimental
  - api_id: gateway.service.status
    protocol: http
    port_name: http
    path_prefix: /api/admin/services
    methods: [GET]
    visibility: descendants
    auth_mode: user
    permission: gateway.read
    version: v1
    stability: stable
redis: []
storage: []
dependencies:
  - auth-service
  - user-service
  - problem-service
  - judge-api
config_schema: {}
secrets:
  - jwt-secret
observability:
  metrics: true
  jaeger: true

