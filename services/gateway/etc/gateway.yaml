Name: gateway-service
Host: 0.0.0.0
Port: 8080
Timeout: 600000

# go-zero's timeout middleware buffers the complete response body. Gateway
# proxy routes enforce their own total deadlines so downloads remain streamed.
Middlewares:
  Timeout: false
  Recover: false

Database:
  Url: ""

Redis:
  Url: ""

Jaeger:
  Endpoint: ojos-jaeger:4317

Jwt:
  Secret: ""

Storage:
  ProblemsRoot: /data/ojos/problems
  SubmissionsRoot: /data/ojos/submissions

Proxy:
  TrustedServices:
    - ServiceID: auth-service
      Target: http://auth-service:8081
      StripPrefix: /api
      HealthCheckID: auth-service-health

  Routes:
    - Prefix: /api/auth
      Target: http://auth-service:8081
      StripPrefix: /api
      AuthMode: optional
      TimeoutMS: 30000

ServiceStatus:
  ComposeServices:
    - auth-service
    - gateway

InternalAuth:
  Enabled: true
  RotationIntervalSeconds: 21600
  VerifyGraceSeconds: 600
  RotateBeforeSeconds: 120
  TimestampSkewSeconds: 60
  NonceTTLSeconds: 120

Orchestrator:
  Endpoint: ""
  InternalToken: ""
  ContributionAckToken: ""
  NodeID: ""

AuthService:
  Endpoint: http://auth-service:8081

WorkloadIdentity:
  PublicKeyFile: ""
  KeyID: "workload-1"
  Issuer: "ojos-auth/workload"
  Audience: "ojos-gateway"
