Name: gateway-service
Host: 0.0.0.0
Port: 8080

Database:
  Url: postgres://postgres:password@postgres:5432/ojos?sslmode=disable

Jaeger:
  Endpoint: ojos-jaeger:4317

Jwt:
  Secret: ojos-dev-secret-change-me

Proxy:
  Routes:
    - Prefix: /api/auth
      Target: http://auth:8081
      StripPrefix: /api
      AuthMode: optional

    - Prefix: /api/judge
      Target: http://judge-api:8082
      StripPrefix: /api
      AuthMode: required

    - Prefix: /api/problem
      Target: http://problem-api:8083
      StripPrefix: /api
      AuthMode: required

InternalAuth:
  Enabled: true
  RotationIntervalSeconds: 21600
  VerifyGraceSeconds: 600
  RotateBeforeSeconds: 120
  TimestampSkewSeconds: 60
  NonceTTLSeconds: 120