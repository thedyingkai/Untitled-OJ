Name: gateway-service
Host: 0.0.0.0
Port: 8080

Database:
  Url: ""

Redis:
  Url: ""

Jaeger:
  Endpoint: ojos-jaeger:4317

Jwt:
  Secret: ""

Storage:
  ProblemsRoot: /data/ojos/problems
  SubmissionsRoot: /data/ojos/submissions

Proxy:
  TrustedServices:
    - ServiceID: auth
      Target: http://auth:8081
      StripPrefix: /api
      HealthCheckID: auth-health

    - ServiceID: problem-api
      Target: http://problem-api:8083
      StripPrefix: /api
      HealthCheckID: problem-api-health

    - ServiceID: judge-api
      Target: http://judge-api:8082
      StripPrefix: /api
      HealthCheckID: judge-api-health

  Routes:
    - Prefix: /api/auth
      Target: http://auth:8081
      StripPrefix: /api
      AuthMode: optional

    - Prefix: /api/judge/worker
      Target: http://judge-api:8082
      StripPrefix: /api
      AuthMode: none

    - Prefix: /api/judge
      Target: http://judge-api:8082
      StripPrefix: /api
      AuthMode: required

    - Prefix: /api/problem
      Target: http://problem-api:8083
      StripPrefix: /api
      AuthMode: required

ServiceStatus:
  ComposeServices:
    - auth
    - gateway
    - problem-api
    - judge-api
    - judge-worker

InternalAuth:
  Enabled: true
  RotationIntervalSeconds: 21600
  VerifyGraceSeconds: 600
  RotateBeforeSeconds: 120
  TimestampSkewSeconds: 60
  NonceTTLSeconds: 120

Orchestrator:
  Endpoint: ""
  InternalToken: ""
