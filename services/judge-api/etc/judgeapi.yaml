Name: judge-api-service
Host: 0.0.0.0
Port: 8082
# Ordinary API bound. The worker claim groups override this to 35 seconds in
# judgeapi.api without widening or buffering every other response.
Timeout: 3000

Database:
  Url: ""

Redis:
  Url: ""

Jaeger:
  Endpoint: ojos-jaeger:4317

AuthService:
  # Fallback route. Only used while InternalGatewayEndpoint is empty.
  Endpoint: ""
  AdminToken: ""
  # Preferred route: the orchestrator resolves PermissionCheckApiID into an
  # effective route and the gateway forwards the call. Set this (or
  # OJOS_AUTH_PERMISSION_GATEWAY_ENDPOINT) to leave the direct route behind.
  InternalGatewayEndpoint: ""
  PermissionCheckApiID: auth.user.permission.check
  CallerService: judge-api
  CallerNodeID: ""
  ServiceToken: ""

Storage:
  SubmissionsRoot: /data/ojos/submissions
  # Legacy compatibility only. Default runtime path is InternalGatewayEndpoint + api_id.
  ServiceEndpoint: ""
  InternalGatewayEndpoint: "http://gateway:8080"
  GetApiID: storage.object.get
  PutApiID: storage.object.put
  HeadApiID: storage.object.head
  Bucket: submissions
  CallerService: judge-api
  CallerNodeID: ""
  ServiceToken: ""

Submission:
  MaxCodeBytes: 262144

ProblemProjection:
  # Fail closed by default. Only legacy development Compose/smoke paths may
  # explicitly opt in while migration fixtures still use package_dir, and a
  # real service startup also requires OJOS_ENVIRONMENT=development.
  AllowLegacyPackageDir: false

Languages:
  Items:
    - Id: cpp17
      DisplayName: C++17
      Version: GCC C++17
      Enabled: true
      SourceFile: main.cpp
    - Id: c11
      DisplayName: C11
      Version: GCC C11
      Enabled: true
      SourceFile: main.c
    - Id: python3
      DisplayName: Python 3
      Version: CPython 3
      Enabled: true
      SourceFile: main.py
    - Id: java17
      DisplayName: Java 17
      Version: OpenJDK 17
      Enabled: true
      SourceFile: Main.java

WorkerAuth:
  Token: ""
  LeaseTTLSeconds: 60

WorkloadIdentity:
  PublicKeyFile: ""
  KeyID: "workload-1"
  Issuer: "ojos-auth/workload"
  Audience: "ojos-gateway"
  # Shared Worker tokens are a development-only compatibility path. A
  # production deployment must provide the workload public key and leaves
  # this disabled.
  AllowLegacyWorkerToken: false

InternalAuth:
  Enabled: true
  TimestampSkewSeconds: 60
  NonceTTLSeconds: 120
