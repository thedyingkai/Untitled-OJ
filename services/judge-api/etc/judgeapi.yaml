Name: judge-api-service
Host: 0.0.0.0
Port: 8082

Database:
  Url: ""

Redis:
  Url: ""

Jaeger:
  Endpoint: ojos-jaeger:4317

Storage:
  SubmissionsRoot: /data/ojos/submissions

Submission:
  MaxCodeBytes: 262144

Languages:
  Items:
    - Id: cpp17
      DisplayName: C++17
      Version: GCC C++17
      Enabled: true
    - Id: c11
      DisplayName: C11
      Version: GCC C11
      Enabled: true
    - Id: python3
      DisplayName: Python 3
      Version: CPython 3
      Enabled: true
    - Id: java17
      DisplayName: Java 17
      Version: OpenJDK 17
      Enabled: true

WorkerAuth:
  Token: ""
  LeaseTTLSeconds: 60

InternalAuth:
  Enabled: true
  TimestampSkewSeconds: 60
  NonceTTLSeconds: 120
