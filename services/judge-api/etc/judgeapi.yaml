Name: judge-api-service
Host: 0.0.0.0
Port: 8082

Database:
  Url: postgres://postgres:password@postgres:5432/ojos?sslmode=disable

Redis:
  Url: redis://ojos-redis:6379/0

Jaeger:
  Endpoint: ojos-jaeger:4317

Storage:
  SubmissionsRoot: /data/ojos/submissions

InternalAuth:
  Enabled: true
  TimestampSkewSeconds: 60
  NonceTTLSeconds: 120