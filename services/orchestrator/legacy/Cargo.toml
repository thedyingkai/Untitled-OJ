[package]
name = "orchestrator-legacy"
version.workspace = true
edition.workspace = true

[features]
default = []
legacy-0_2 = []

[[bin]]
name = "ojos-orchestrator-v0-2-upgrade-fixture"
path = "src/bin/ojos-orchestrator-v0-2-upgrade-fixture.rs"
required-features = ["legacy-0_2"]
test = false

[dependencies]
anyhow.workspace = true
flate2 = "1"
orchestrator-domain = { package = "orchestrator-core", path = "../core" }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
regex.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
tar = "0.4"
thiserror.workspace = true
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
zip = { version = "5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
