schema_version: 1
id: storage
name: Storage
version: 0.1.0
kind: storage
description: 对象存储或外部存储 Endpoint，用于 problems、submissions 和 judge-artifacts。
runtime:
  mode: external
  driver: external
  root_allowed: true
  non_root_allowed: true
  start_policy: external
  restart_policy: external
endpoint:
  protocol: http
  default_port: 9000
  health_path: /health
  expose: false
  routes: []
requires:
  services: []
  links: []
  storage: []
  database: []
  queue: []
  secrets: []
provides:
  capabilities:
    - storage.object
    - storage.artifact
  endpoints:
    - http
  routes: []
  workers: []
  storage_buckets:
    - problems
    - submissions
    - judge-artifacts
  events: []
config_schema:
  buckets:
    type: array
    default:
      - problems
      - submissions
      - judge-artifacts
resources:
  cpu: shared
  memory: 512Mi
  disk: 32Gi
  gpu: none
  network: internal
security:
  allow_privileged: false
  allow_host_mount: false
  allow_arbitrary_command: false
  required_secrets: []
  sandbox: {}
  network_policy:
    internal_only: true
source:
  type: external
  ref: object-storage
  build: {}
  artifact: {}
ui:
  enabled: false
  routes: []
  menus: []
  permissions: []
permissions:
  - storage.read
health:
  checks:
    - http
  timeout_seconds: 3
  interval_seconds: 10
