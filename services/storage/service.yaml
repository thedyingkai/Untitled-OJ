schema_version: 1
id: storage
name: Storage
version: 0.1.0
kind: storage
endpoint:
  protocol: http
  default_port: 9000
  health_path: /health
runtime:
  mode: external
  root_allowed: true
  non_root_allowed: true
config_schema:
  buckets:
    type: array
    default:
      - problems
      - submissions
      - judge-artifacts
requires:
  links: []
provides:
  capabilities:
    - storage.object
    - storage.artifact
ui:
  enabled: false
permissions:
  - storage.read
security:
  allow_privileged: false
  allow_host_mount: false
  allow_arbitrary_command: false
