schema_version: 2
service_name: user-service
version: 0.1.0
description: Release contract for user-service.
service_type: backend-api
source:
  kind: local
  url: local://services/user-service
  checksum: ""
runtime:
  kind: image
  image: ""
  binary: ""
  system_service: ""
frontend:
  enabled: true
  route_prefix: "/me"
  remote_entry: "/assets/user-service/remoteEntry.js"
  menu_items: []
backend:
  protocol: http
  port: 8084
  health_path: /health
migrations:
  - version: "000001_user_profile_schema"
    path: services/user-service/migrations/000001_user_profile_schema.up.sql
    checksum: sha256:a04fa319c993564f740f7dd149119bd43bba6705645a213a72eba8bd65f7f92d
permissions:
  - user.profile.read.self
  - user.profile.update.self
  - user.profile.read.any
  - user.profile.update.any
  - user.stats.read
routes:
  - path: /api/users/**
    method: ANY
    target_type: endpoint-group
    target: user-service[*]
    permission: user.profile.read.self
provides:
  apis:
    - id: user.profile.read
      version: 1.0.0
      protocol: http
      path: /api/users
      methods: [GET]
      visibility: descendants
      auth: user
      permission: user.profile.read.self
      stability: stable
    - id: user.profile.update
      version: 1.0.0
      protocol: http
      path: /api/users
      methods: [PATCH]
      visibility: descendants
      auth: user
      permission: user.profile.update.self
      stability: stable
requires:
  apis:
    - name: permission_check
      id: auth.user.permission.check
      version: ">=1.0.0, <2.0.0"
      optional: false
      selection: explicit
      timeout_ms: 5000
events:
  publishes: []
  subscribes: []
runtime_contract:
  id: standard-container-v1
  sha256: sha256:56c8ec1e421205dbebb97ad40cbda30bf468d198dd8c3fc50151e39465ea573f
  binding_directory: /run/ojos/service
  identity_mode: workload
  credential_delivery: file
  restart_on_change: false
redis: []
storage:
  - object_type: avatar
    bucket: avatars
dependencies:
  - auth-service
  - postgresql
  - storage-service
config_schema: {}
secrets: []
observability:
  metrics: true
  jaeger: true
