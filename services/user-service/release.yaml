schema_version: 1
service_name: user-service
version: 0.1.0
description: Release contract for user-service.
service_type: backend-api
source:
  kind: local
  url: local://services/user-service
  checksum: ""
runtime:
  kind: image
  image: ""
  binary: ""
  system_service: ""
frontend:
  enabled: true
  route_prefix: "/me"
  remote_entry: "/assets/user-service/remoteEntry.js"
  menu_items: []
backend:
  protocol: http
  port: 8084
  health_path: /health
migrations:
  - version: "000001_user_profile_schema"
    path: services/user-service/migrations/000001_user_profile_schema.up.sql
    checksum: sha256:a04fa319c993564f740f7dd149119bd43bba6705645a213a72eba8bd65f7f92d
permissions:
  - user.profile.read.self
  - user.profile.update.self
  - user.profile.read.any
  - user.profile.update.any
  - user.stats.read
routes:
  - path: /api/users/**
    method: ANY
    target_type: endpoint-group
    target: user-service[*]
    permission: user.profile.read.self
apis:
  - api_id: user.profile.read
    protocol: http
    port_name: http
    path_prefix: /api/users
    methods: [GET]
    visibility: descendants
    auth_mode: user
    permission: user.profile.read.self
    version: v1
    stability: stable
  - api_id: user.profile.update
    protocol: http
    port_name: http
    path_prefix: /api/users
    methods: [PATCH]
    visibility: descendants
    auth_mode: user
    permission: user.profile.update.self
    version: v1
    stability: stable
redis: []
storage:
  - object_type: avatar
    bucket: avatars
dependencies:
  - auth-service
  - postgresql
  - storage-service
config_schema: {}
secrets: []
observability:
  metrics: true
  jaeger: true

