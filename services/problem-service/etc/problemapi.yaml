Name: problem-service
Host: 0.0.0.0
Port: 8083

Database:
  Url: ""

Redis:
  Url: ""

Jaeger:
  Endpoint: ojos-jaeger:4317

AuthService:
  # Fallback route. Only used while InternalGatewayEndpoint is empty.
  Endpoint: ""
  AdminToken: ""
  # Preferred route: the orchestrator resolves PermissionCheckApiID into an
  # effective route and the gateway forwards the call. Set this (or
  # OJOS_AUTH_PERMISSION_GATEWAY_ENDPOINT) to leave the direct route behind.
  InternalGatewayEndpoint: ""
  PermissionCheckApiID: auth.user.permission.check
  CallerService: problem-service
  CallerNodeID: ""
  ServiceToken: ""

Storage:
  ProblemsRoot: /data/ojos/problems

# Production enables orphan-artifact GC through the storage.object.head and
# storage.object.delete ApiBindings declared by Service Contract v3. No Judge DB or direct
# Storage endpoint is accepted by that path. Unmanaged development leaves GC
# disabled unless OJOS_PROBLEM_ARTIFACT_GC_ENABLED is explicitly set.
# OJOS_PROBLEM_ARTIFACT_GC_CLAIM_LEASE defaults to 10m and must be strictly
# longer than the storage.object.delete Binding timeout plus a 60s isolation grace.

InternalAuth:
  Enabled: true
  TimestampSkewSeconds: 60
  NonceTTLSeconds: 120
