permissions:
  - auth.admin
  - system.admin
routes:
  - path: /api/auth/**
    method: ANY
    target_type: endpoint-group
    target: auth-service[*]
    permission: public
apis:
  - api_id: auth.login
    protocol: http
    port_name: http
    path_prefix: /auth/login
    methods: [POST]
    visibility: descendants
    auth_mode: public
    permission: public
    version: v1
    stability: stable
  - api_id: auth.permission.check
    protocol: http
    port_name: http
    path_prefix: /auth/permission-check
    methods: [POST]
    visibility: descendants
    auth_mode: service
    permission: system.admin
    version: v1
    stability: stable
  - api_id: auth.user.permissions
    protocol: http
    port_name: http
    path_prefix: /auth/users/permissions
    methods: [GET]
    visibility: descendants
    auth_mode: user
    permission: auth.admin
    version: v1
    stability: stable
redis:
  - name: redis
    kind: stream
    usage: auth audit queue
storage: []
dependencies:
  - postgresql
  - redis
config_schema: {}
secrets:
  - jwt-secret
observability:
  metrics: true
  jaeger: true

