schema_version: 1
service_name: auth-service
version: 0.1.0
description: Release contract for auth-service.
service_type: backend-api
source:
  kind: local
  url: local://services/auth-service
  checksum: ""
runtime:
  kind: image
  image: ""
  binary: ""
  system_service: ""
frontend:
  enabled: true
  route_prefix: "/login"
  remote_entry: "/assets/auth-service/remoteEntry.js"
  menu_items: []
backend:
  protocol: http
  port: 8081
  health_path: /health
migrations:
  - version: "000001_init_schema"
    path: services/auth-service/migrations/000001_init_schema.up.sql
    checksum: sha256:c1205afb55cb5bf50110f8fbcf2a7b1eceb5e5f8ed23eb65c959a0ff605ffc55
  - version: "000003_permission_core"
    path: services/auth-service/migrations/000003_permission_core.up.sql
    checksum: sha256:9fd4893efc8c7553aeb855e539648be13c681fac74d6c9ada001778d56c398ec
  - version: "000006_add_internal_auth_keys"
    path: services/auth-service/migrations/000006_add_internal_auth_keys.up.sql
    checksum: sha256:63e532eae31e7ec491046978c1c6e3628bad384b67bf1f30c48d8bab1207698e
  - version: "000007_service_identity_grants"
    path: services/auth-service/migrations/000007_service_identity_grants.up.sql
    checksum: sha256:9cf06075b3977f234bb885e533e7abe165cd3d1f92f393b3ec1eefd39740ebc9
  - version: "000008_service_credentials"
    path: services/auth-service/migrations/000008_service_credentials.up.sql
    checksum: sha256:4bc2991c93d7c2d76d73ddfe06870d462ebae68fc7902f7ba2a33e568d567ae5
permissions:
  - auth.admin
  - system.admin
routes:
  - path: /api/auth/**
    method: ANY
    target_type: endpoint-group
    target: auth-service[*]
    permission: public
apis:
  - api_id: auth.login
    protocol: http
    port_name: http
    path_prefix: /auth/login
    methods: [POST]
    visibility: descendants
    auth_mode: public
    permission: public
    version: v1
    stability: stable
  - api_id: auth.permission.check
    protocol: http
    port_name: http
    path_prefix: /auth/permission-check
    methods: [POST]
    visibility: descendants
    auth_mode: service
    permission: system.admin
    version: v1
    stability: stable
  - api_id: auth.user.permissions
    protocol: http
    port_name: http
    path_prefix: /auth/users/permissions
    methods: [GET]
    visibility: descendants
    auth_mode: user
    permission: auth.admin
    version: v1
    stability: stable
redis:
  - name: redis
    kind: stream
    usage: auth audit queue
storage: []
dependencies:
  - postgresql
  - redis
config_schema: {}
secrets:
  - jwt-secret
observability:
  metrics: true
  jaeger: true

