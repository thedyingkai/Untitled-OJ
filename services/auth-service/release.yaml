permissions:
  - auth.admin
  - auth.permission.check
  - system.admin
routes:
  - path: /api/auth/**
    method: ANY
    target_type: endpoint-group
    target: auth-service[*]
    permission: public
provides:
  apis:
    - id: auth.login
      version: 1.0.0
      protocol: http
      path: /auth/login
      methods: [POST]
      visibility: descendants
      auth: public
      permission: public
      stability: stable
    - id: auth.user.permission.check
      version: 1.0.0
      protocol: http
      path: /auth/admin/permission-check
      methods: [POST]
      visibility: explicit
      auth: workload
      permission: auth.permission.check
      stability: stable
      timeout_ms: 5000
    - id: auth.user.permissions
      version: 1.0.0
      protocol: http
      path: /auth/admin/users
      methods: [GET]
      visibility: descendants
      auth: user
      permission: auth.admin
      stability: stable
