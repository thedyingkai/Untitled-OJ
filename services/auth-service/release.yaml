schema_version: 1
service_name: auth-service
version: 0.1.0
description: Release contract for auth-service.
service_type: backend-api
source:
  kind: local
  url: local://services/auth-service
  checksum: ""
runtime:
  kind: local-process
  image: ""
  binary: ""
  system_service: ""
  command: go
  args: ["run", ".", "-f", "${OJOS_AUTH_SERVICE_CONFIG}"]
  working_dir: services/auth-service
  env: {}
frontend:
  enabled: true
  route_prefix: "/login"
  remote_entry: "/assets/auth-service/remoteEntry.js"
  menu_items: []
backend:
  protocol: http
  port: 8081
  health_path: /health
