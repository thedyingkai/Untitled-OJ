Name: auth-service
Host: 0.0.0.0
Port: 8081

Database:
  Url: ""

Jaeger:
  Endpoint: ojos-jaeger:4317

Jwt:
  Secret: ""
  ExpireHours: 24

InternalAuth:
  Token: ""

# Optional one-time initial administrator bootstrap. Configure exactly one of
# Secret or SecretFile. Production deployments should mount a dedicated secret
# file and remove it after the bootstrap request succeeds.
AdminBootstrap:
  Secret: ""
  SecretFile: ""

WorkloadIdentity:
  PrivateKeyFile: ""
  ControlPlaneToken: ""
  KeyID: "workload-1"
  Issuer: "ojos-auth/workload"
  Audience: "ojos-gateway"
  TTLSeconds: 900
